<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>得森設計 · 財務報表</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500&family=Noto+Sans+TC:wght@300;400;500&display=swap');
:root{
  --sage:#C0C4B6;--sage-dk:#8a9082;--sage-pa:#eef0ea;
  --ink:#2b2926;--ink-m:#4a4742;--ink-l:#8a8780;--ink-f:#c8c4be;
  --paper:#faf9f6;--paper-w:#f5f2ee;--paper-c:#ffffff;
  --border:#dddad4;--border-l:#eae8e2;--stone:#AEAFB1;
  --red:#c0392b;--red-pa:#fdf0ee;--green:#2e7d32;--green-pa:#e8f5e9;
  --gold:#8a6914;--gold-pa:#fef9e7;
  --serif:'Noto Serif TC',serif;--sans:'Noto Sans TC',sans-serif;
  --r:6px;--rl:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);min-height:100vh;}

/* NAV */
nav{background:var(--paper-c);border-bottom:1px solid var(--border);padding:0 24px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.nav-logo{height:36px;width:auto;}
.nav-links{display:flex;gap:16px;align-items:center;}
.nav-link{font-size:12px;color:var(--ink-l);text-decoration:none;letter-spacing:1px;padding:4px 8px;border-radius:var(--r);transition:all .2s;}
.nav-link:hover{color:var(--ink);background:var(--paper-w);}
.nav-link.active{color:var(--sage-dk);font-weight:500;}

/* TABS */
.tab-bar{display:flex;gap:0;border-bottom:1px solid var(--border);background:var(--paper-c);padding:0 24px;overflow-x:auto;}
.tab{padding:12px 20px;font-size:13px;color:var(--ink-l);cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap;letter-spacing:.5px;transition:all .2s;}
.tab:hover{color:var(--ink);}
.tab.on{color:var(--sage-dk);border-bottom-color:var(--sage-dk);}

/* MAIN */
.main{max-width:1100px;margin:0 auto;padding:24px;}

/* CARDS */
.card{background:var(--paper-c);border:1px solid var(--border-l);border-radius:var(--rl);overflow:hidden;margin-bottom:16px;}
.card-hd{padding:12px 16px;border-bottom:1px solid var(--border-l);background:var(--paper-w);display:flex;align-items:center;justify-content:space-between;}
.card-hd h3{font-family:var(--serif);font-size:13px;font-weight:400;color:var(--ink-m);letter-spacing:2px;}

/* STAT GRID */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:20px;}
.stat-card{background:var(--paper-c);border:1px solid var(--border-l);border-radius:var(--rl);padding:16px 20px;}
.stat-label{font-size:10px;color:var(--ink-l);letter-spacing:2px;margin-bottom:6px;}
.stat-value{font-size:24px;font-family:var(--serif);color:var(--ink);}
.stat-value.green{color:var(--green);}
.stat-value.red{color:var(--red);}
.stat-value.gold{color:var(--gold);}
.stat-sub{font-size:11px;color:var(--ink-l);margin-top:4px;}

/* TABLE */
table{width:100%;border-collapse:collapse;font-size:12px;}
thead tr{background:var(--paper-w);border-bottom:2px solid var(--border);}
th{padding:10px 14px;text-align:left;color:var(--ink-l);font-weight:400;letter-spacing:1px;white-space:nowrap;}
th.r{text-align:right;}
td{padding:10px 14px;border-bottom:1px solid var(--border-l);color:var(--ink);}
td.r{text-align:right;}
tr:last-child td{border-bottom:none;}
tr.total-row{background:var(--paper-w);font-weight:500;border-top:2px solid var(--border);}
tr:hover td{background:var(--sage-pa);}

/* BADGE */
.badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:10px;letter-spacing:1px;}
.badge-green{background:var(--green-pa);color:var(--green);}
.badge-red{background:var(--red-pa);color:var(--red);}
.badge-gold{background:var(--gold-pa);color:var(--gold);}
.badge-stone{background:#f5f5f5;color:var(--stone);}

/* PROGRESS BAR */
.prog-wrap{width:100%;height:6px;background:var(--border-l);border-radius:3px;overflow:hidden;}
.prog-bar{height:100%;border-radius:3px;transition:width .3s;}

/* PANEL */
.panel{display:none;}
.panel.on{display:block;}

/* CHART */
.chart-wrap{padding:16px;overflow-x:auto;}
.bar-chart{display:flex;align-items:flex-end;gap:8px;height:160px;padding-bottom:24px;position:relative;}
.bar-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;min-width:40px;}
.bar{width:100%;border-radius:3px 3px 0 0;transition:height .3s;min-height:2px;}
.bar-label{font-size:10px;color:var(--ink-l);text-align:center;white-space:nowrap;}
.bar-val{font-size:10px;color:var(--ink-m);font-family:var(--serif);}

@media(max-width:600px){
  .stat-grid{grid-template-columns:1fr 1fr;}
  .main{padding:16px;}
  th,td{padding:8px 10px;}
}
</style>
</head>

<script>
const KPR='ds_projects';
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbw6H86-UzVOhptUuE6z3uBy96vzqpV93cXpTsvt5KgOYwbhqdE5J9jmOIMf6cAAyB5U/exec';

function getProjects(){return JSON.parse(localStorage.getItem(KPR)||'[]');}
function fmt(n){return'$ '+Math.round(n).toLocaleString('zh-TW');}
function fmtPct(n){return Math.round(n)+'%';}

// ── TABS ──
function goTab(id){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  document.getElementById('p-'+id).classList.add('on');
  const tabs=['dashboard','receivable','payable','projects','monthly'];
  document.querySelectorAll('.tab')[tabs.indexOf(id)].classList.add('on');
  if(id==='dashboard')renderDashboard();
  else if(id==='receivable')renderReceivable();
  else if(id==='payable')renderPayable();
  else if(id==='projects')renderProjects();
  else if(id==='monthly')renderMonthly();
}

// ── DATA HELPERS ──
function getProjFinance(proj){
  const budget=proj.budget||0;
  const receipts=proj.receipts||[];
  const received=receipts.reduce((s,r)=>s+(r.amount||0),0);
  const vendors=proj.vendors||[];
  const totalQuote=vendors.reduce((s,v)=>s+(v.quote||0),0);
  const paid=vendors.reduce((s,v)=>(v.payments||[]).reduce((ss,p)=>ss+(p.amount||0),s),0);
  const oldPaid=(proj.payouts||[]).reduce((s,p)=>s+(p.amount||0),0);
  const totalPaid=paid+oldPaid;
  const unpaidVendors=vendors.reduce((s,v)=>{const p=(v.payments||[]).reduce((ss,pp)=>ss+(pp.amount||0),0);return s+Math.max(0,(v.quote||0)-p);},0);
  const profit=received-totalPaid;
  const profitRate=received>0?profit/received*100:0;
  return{budget,received,totalPaid,totalQuote,unpaidVendors,profit,profitRate,unpaidFromBudget:budget-received};
}

// ── DASHBOARD ──
function renderDashboard(){
  const projs=getProjects();
  let totalReceived=0,totalPaid=0,totalUnpaidRecv=0,totalUnpaidPay=0;
  projs.forEach(p=>{
    const f=getProjFinance(p);
    totalReceived+=f.received;totalPaid+=f.totalPaid;
    totalUnpaidRecv+=Math.max(0,f.budget-f.received);
    totalUnpaidPay+=f.unpaidVendors;
  });
  const totalProfit=totalReceived-totalPaid;
  const profitRate=totalReceived>0?totalProfit/totalReceived*100:0;

  document.getElementById('dash-stats').innerHTML=`
    <div class="stat-card">
      <div class="stat-label">累積已收款</div>
      <div class="stat-value green">${fmt(totalReceived)}</div>
      <div class="stat-sub">所有案場合計</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">累積已付工班</div>
      <div class="stat-value red">${fmt(totalPaid)}</div>
      <div class="stat-sub">所有案場合計</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">累積毛利</div>
      <div class="stat-value ${totalProfit>=0?'green':'red'}">${fmt(totalProfit)}</div>
      <div class="stat-sub">毛利率 ${fmtPct(profitRate)}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">應收未收</div>
      <div class="stat-value gold">${fmt(totalUnpaidRecv)}</div>
      <div class="stat-sub">待向業主收款</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">應付未付</div>
      <div class="stat-value gold">${fmt(totalUnpaidPay)}</div>
      <div class="stat-sub">待付廠商款項</div>
    </div>`;

  // Dash receivable
  const recvItems=[];
  projs.forEach(p=>{
    const f=getProjFinance(p);
    if(f.unpaidFromBudget>0)recvItems.push({proj:p,amount:f.unpaidFromBudget,received:f.received,budget:f.budget});
  });
  recvItems.sort((a,b)=>b.amount-a.amount);
  document.getElementById('dash-receivable').innerHTML=recvItems.slice(0,5).map(i=>`
    <div style="padding:10px 14px;border-bottom:1px solid var(--border-l);display:flex;justify-content:space-between;align-items:center;">
      <div>
        <div style="font-size:13px;color:var(--ink);">${i.proj.name}</div>
        <div style="font-size:11px;color:var(--ink-l);">${i.proj.ownerName||''}</div>
      </div>
      <div style="text-align:right;">
        <div style="font-size:13px;color:var(--red);font-weight:500;">${fmt(i.amount)}</div>
        <div style="font-size:10px;color:var(--ink-l);">已收 ${Math.round(i.received/i.budget*100)||0}%</div>
      </div>
    </div>`).join('')||'<div style="padding:16px;text-align:center;font-size:12px;color:var(--ink-l);">無待收款項</div>';

  // Dash payable
  const payItems=[];
  projs.forEach(p=>{
    (p.vendors||[]).forEach(v=>{
      const paid=(v.payments||[]).reduce((s,pp)=>s+(pp.amount||0),0);
      const unpaid=(v.quote||0)-paid;
      if(unpaid>0)payItems.push({proj:p,vendor:v,unpaid});
    });
  });
  payItems.sort((a,b)=>b.unpaid-a.unpaid);
  document.getElementById('dash-payable').innerHTML=payItems.slice(0,5).map(i=>`
    <div style="padding:10px 14px;border-bottom:1px solid var(--border-l);display:flex;justify-content:space-between;align-items:center;">
      <div>
        <div style="font-size:13px;color:var(--ink);">${i.vendor.cat||''} · ${i.vendor.vendor||''}</div>
        <div style="font-size:11px;color:var(--ink-l);">${i.proj.name}</div>
      </div>
      <div style="text-align:right;">
        <div style="font-size:13px;color:var(--red);font-weight:500;">${fmt(i.unpaid)}</div>
        ${!i.vendor.invoiceReceived?'<div style="font-size:10px;color:var(--gold);">發票待收</div>':''}
      </div>
    </div>`).join('')||'<div style="padding:16px;text-align:center;font-size:12px;color:var(--ink-l);">無待付款項</div>';

  // Dash proj profit
  document.getElementById('dash-proj-profit').innerHTML=`<div style="overflow-x:auto;"><table>
    <thead><tr><th>案場</th><th>業主</th><th class="r">合約</th><th class="r">已收</th><th class="r">已付</th><th class="r">毛利</th><th class="r">毛利率</th><th>狀態</th></tr></thead>
    <tbody>${projs.map(p=>{
      const f=getProjFinance(p);
      const cls=f.profitRate>=30?'badge-green':f.profitRate>=10?'badge-gold':'badge-red';
      const lbl=f.profitRate>=30?'健康':f.profitRate>=10?'注意':'虧損';
      return`<tr>
        <td>${p.name}</td><td style="color:var(--ink-l);">${p.ownerName||'—'}</td>
        <td class="r">${fmt(f.budget)}</td>
        <td class="r" style="color:var(--green);">${fmt(f.received)}</td>
        <td class="r" style="color:var(--red);">${fmt(f.totalPaid)}</td>
        <td class="r" style="${f.profit>=0?'color:var(--green)':'color:var(--red);'}">${fmt(f.profit)}</td>
        <td class="r">${fmtPct(f.profitRate)}</td>
        <td><span class="badge ${cls}">${lbl}</span></td>
      </tr>`;
    }).join('')}</tbody>
  </table></div>`;
}

// ── RECEIVABLE ──
function renderReceivable(){
  const projs=getProjects();
  let rows='';let totalBudget=0,totalRecv=0,totalUnpaid=0;
  projs.forEach(p=>{
    const f=getProjFinance(p);
    const unpaid=Math.max(0,f.budget-f.received);
    const pct=f.budget>0?Math.round(f.received/f.budget*100):0;
    totalBudget+=f.budget;totalRecv+=f.received;totalUnpaid+=unpaid;
    rows+=`<tr>
      <td><a href="project-manager.html" style="color:var(--sage-dk);text-decoration:none;">${p.name}</a></td>
      <td style="color:var(--ink-l);">${p.ownerName||'—'}</td>
      <td>${(p.receipts||[]).map(r=>r.label).filter(Boolean).join('、')||'—'}</td>
      <td class="r">${fmt(f.budget)}</td>
      <td class="r" style="color:var(--green);">${fmt(f.received)}</td>
      <td class="r" style="color:${unpaid>0?'var(--red)':'var(--ink-f)'};">${unpaid>0?fmt(unpaid):'已付清'}</td>
      <td style="min-width:100px;">
        <div class="prog-wrap"><div class="prog-bar" style="width:${pct}%;background:${pct>=100?'var(--green)':'var(--sage-dk)'};"></div></div>
        <div style="font-size:10px;color:var(--ink-l);margin-top:2px;">${pct}%</div>
      </td>
      <td><a href="project-manager.html" style="font-size:11px;color:var(--sage-dk);">前往案場</a></td>
    </tr>`;
  });
  rows+=`<tr class="total-row">
    <td colspan="3">合計</td>
    <td class="r">${fmt(totalBudget)}</td>
    <td class="r" style="color:var(--green);">${fmt(totalRecv)}</td>
    <td class="r" style="color:var(--red);">${fmt(totalUnpaid)}</td>
    <td colspan="2"></td>
  </tr>`;
  document.getElementById('receivable-tbody').innerHTML=rows;
}

// ── PAYABLE ──
function renderPayable(){
  const projs=getProjects();
  let rows='';let totalQ=0,totalP=0,totalU=0;
  projs.forEach(p=>{
    (p.vendors||[]).forEach(v=>{
      const paid=(v.payments||[]).reduce((s,pp)=>s+(pp.amount||0),0);
      const unpaid=Math.max(0,(v.quote||0)-paid);
      const statusColor=paid===0?'var(--stone)':unpaid<=0?'var(--green)':'var(--gold)';
      const statusLabel=paid===0?'未付':unpaid<=0?'已付清':'部分';
      totalQ+=(v.quote||0);totalP+=paid;totalU+=unpaid;
      rows+=`<tr>
        <td>${p.name}</td>
        <td style="color:var(--ink-l);">${v.cat||'—'}</td>
        <td>${v.vendor||'—'}${v.docUrl?` <a href="${v.docUrl}" target="_blank" style="font-size:10px;color:var(--sage-dk);">📄</a>`:''}</td>
        <td class="r">${fmt(v.quote||0)}</td>
        <td class="r" style="color:var(--green);">${fmt(paid)}</td>
        <td class="r" style="color:${unpaid>0?'var(--red)':'var(--ink-f)'};">${unpaid>0?fmt(unpaid):'—'}</td>
        <td><span class="badge" style="background:${statusColor}22;color:${statusColor};">${statusLabel}</span></td>
        <td>${v.invoiceReceived?'<span class="badge badge-green">已收</span>':'<span class="badge badge-stone">待收</span>'}</td>
      </tr>`;
    });
  });
  rows+=`<tr class="total-row">
    <td colspan="3">合計</td>
    <td class="r">${fmt(totalQ)}</td>
    <td class="r" style="color:var(--green);">${fmt(totalP)}</td>
    <td class="r" style="color:var(--red);">${fmt(totalU)}</td>
    <td colspan="2"></td>
  </tr>`;
  document.getElementById('payable-tbody').innerHTML=rows;
}

// ── PROJ PROFIT ──
function renderProjects(){
  const projs=getProjects();
  document.getElementById('proj-profit-list').innerHTML=projs.map(p=>{
    const f=getProjFinance(p);
    const pct=f.budget>0?Math.round(f.received/f.budget*100):0;
    const profitColor=f.profit>=0?'var(--green)':'var(--red)';
    const healthCls=f.profitRate>=30?'badge-green':f.profitRate>=10?'badge-gold':'badge-red';
    const healthLbl=f.profitRate>=30?'健康':f.profitRate>=10?'注意':'虧損';
    return`<div class="card">
      <div class="card-hd">
        <div>
          <h3 style="font-size:15px;letter-spacing:2px;">${p.name}</h3>
          <span style="font-size:11px;color:var(--ink-l);">${p.ownerName||''} ${p.address?'· '+p.address:''}</span>
        </div>
        <span class="badge ${healthCls}">${healthLbl}</span>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:0;border-bottom:1px solid var(--border-l);">
        <div style="padding:14px;border-right:1px solid var(--border-l);">
          <div style="font-size:10px;color:var(--ink-l);letter-spacing:1px;margin-bottom:4px;">合約金額</div>
          <div style="font-size:18px;font-family:var(--serif);">${fmt(f.budget)}</div>
        </div>
        <div style="padding:14px;border-right:1px solid var(--border-l);">
          <div style="font-size:10px;color:var(--green);letter-spacing:1px;margin-bottom:4px;">已收款</div>
          <div style="font-size:18px;font-family:var(--serif);color:var(--green);">${fmt(f.received)}</div>
          <div style="font-size:10px;color:var(--ink-l);margin-top:2px;">未收 ${fmt(Math.max(0,f.budget-f.received))}</div>
        </div>
        <div style="padding:14px;border-right:1px solid var(--border-l);">
          <div style="font-size:10px;color:var(--red);letter-spacing:1px;margin-bottom:4px;">廠商發包</div>
          <div style="font-size:18px;font-family:var(--serif);color:var(--red);">${fmt(f.totalQuote)}</div>
          <div style="font-size:10px;color:var(--ink-l);margin-top:2px;">已付 ${fmt(f.totalPaid)}</div>
        </div>
        <div style="padding:14px;">
          <div style="font-size:10px;letter-spacing:1px;margin-bottom:4px;color:${profitColor};">毛利</div>
          <div style="font-size:18px;font-family:var(--serif);color:${profitColor};">${fmt(f.profit)}</div>
          <div style="font-size:10px;color:var(--ink-l);margin-top:2px;">毛利率 ${fmtPct(f.profitRate)}</div>
        </div>
      </div>
      <div style="padding:12px 14px;">
        <div style="font-size:10px;color:var(--ink-l);margin-bottom:6px;">收款進度 ${pct}%</div>
        <div class="prog-wrap" style="height:8px;"><div class="prog-bar" style="width:${pct}%;background:${pct>=100?'var(--green)':'var(--sage-dk)'};"></div></div>
      </div>
      ${(p.vendors||[]).length?`<div style="overflow-x:auto;border-top:1px solid var(--border-l);">
        <table><thead><tr><th>工種</th><th>廠商</th><th class="r">報價</th><th class="r">已付</th><th class="r">未付</th><th>發票</th></tr></thead>
        <tbody>${(p.vendors||[]).map(v=>{
          const pd=(v.payments||[]).reduce((s,pp)=>s+(pp.amount||0),0);
          const un=Math.max(0,(v.quote||0)-pd);
          return`<tr>
            <td>${v.cat||'—'}</td>
            <td>${v.vendor||'—'}</td>
            <td class="r">${fmt(v.quote||0)}</td>
            <td class="r" style="color:var(--green);">${fmt(pd)}</td>
            <td class="r" style="color:${un>0?'var(--red)':'var(--ink-f)'};">${un>0?fmt(un):'—'}</td>
            <td>${v.invoiceReceived?'<span class="badge badge-green">已收</span>':'<span class="badge badge-stone">待收</span>'}</td>
          </tr>`;
        }).join('')}</tbody></table>
      </div>`:''}
    </div>`;
  }).join('')||'<div class="card" style="padding:32px;text-align:center;color:var(--ink-l);">尚無案場資料</div>';
}

// ── MONTHLY ──
function renderMonthly(){
  const projs=getProjects();
  const monthly={};
  projs.forEach(p=>{
    (p.receipts||[]).forEach(r=>{
      if(!r.date)return;
      const ym=r.date.slice(0,7);
      if(!monthly[ym])monthly[ym]={recv:0,paid:0};
      monthly[ym].recv+=(r.amount||0);
    });
    (p.vendors||[]).forEach(v=>{
      (v.payments||[]).forEach(pp=>{
        if(!pp.date)return;
        const ym=pp.date.slice(0,7);
        if(!monthly[ym])monthly[ym]={recv:0,paid:0};
        monthly[ym].paid+=(pp.amount||0);
      });
    });
    (p.payouts||[]).forEach(pp=>{
      if(!pp.date)return;
      const ym=pp.date.slice(0,7);
      if(!monthly[ym])monthly[ym]={recv:0,paid:0};
      monthly[ym].paid+=(pp.amount||0);
    });
  });
  const months=Object.keys(monthly).sort();
  if(!months.length){
    document.getElementById('monthly-chart').innerHTML='<div style="text-align:center;color:var(--ink-l);font-size:12px;padding:40px;">尚無收支記錄</div>';
    document.getElementById('monthly-tbody').innerHTML='';
    return;
  }
  const maxVal=Math.max(...months.map(m=>Math.max(monthly[m].recv,monthly[m].paid)),1);
  document.getElementById('monthly-chart').innerHTML=months.map(m=>{
    const recv=monthly[m].recv;const paid=monthly[m].paid;
    const rh=Math.round(recv/maxVal*140);const ph=Math.round(paid/maxVal*140);
    return`<div class="bar-wrap">
      <div class="bar-val">${recv>0?'$'+Math.round(recv/1000)+'K':''}</div>
      <div style="display:flex;gap:2px;align-items:flex-end;height:140px;">
        <div class="bar" style="width:18px;height:${rh}px;background:var(--green);opacity:.8;" title="收款"></div>
        <div class="bar" style="width:18px;height:${ph}px;background:var(--red);opacity:.7;" title="支出"></div>
      </div>
      <div class="bar-label">${m.slice(5)}月</div>
    </div>`;
  }).join('');
  let tbody='';let totalR=0,totalP=0;
  months.forEach(m=>{
    const recv=monthly[m].recv;const paid=monthly[m].paid;
    const profit=recv-paid;const rate=recv>0?profit/recv*100:0;
    totalR+=recv;totalP+=paid;
    tbody+=`<tr>
      <td>${m}</td>
      <td class="r" style="color:var(--green);">${fmt(recv)}</td>
      <td class="r" style="color:var(--red);">${fmt(paid)}</td>
      <td class="r" style="color:${profit>=0?'var(--green)':'var(--red)'};">${fmt(profit)}</td>
      <td class="r">${fmtPct(rate)}</td>
    </tr>`;
  });
  const totalProfit=totalR-totalP;
  tbody+=`<tr class="total-row">
    <td>合計</td>
    <td class="r" style="color:var(--green);">${fmt(totalR)}</td>
    <td class="r" style="color:var(--red);">${fmt(totalP)}</td>
    <td class="r" style="color:${totalProfit>=0?'var(--green)':'var(--red)'};">${fmt(totalProfit)}</td>
    <td class="r">${fmtPct(totalR>0?totalProfit/totalR*100:0)}</td>
  </tr>`;
  document.getElementById('monthly-tbody').innerHTML=tbody;
}

// Init
renderDashboard();
</script>
