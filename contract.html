<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>得森設計 · 合約管理</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500&family=Noto+Sans+TC:wght@300;400;500&display=swap');
:root{
  --sage:#C0C4B6;--sage-dk:#8a9082;--sage-pa:#eef0ea;
  --ink:#2b2926;--ink-m:#4a4742;--ink-l:#8a8780;--ink-f:#c8c4be;
  --paper:#faf9f6;--paper-w:#f5f2ee;--paper-c:#ffffff;
  --border:#dddad4;--border-l:#eae8e2;--stone:#AEAFB1;
  --red:#c0392b;--red-pa:#fdf0ee;--green:#2e7d32;--green-pa:#e8f5e9;
  --gold:#8a6914;--gold-pa:#fef9e7;--blue:#1565c0;
  --serif:'Noto Serif TC',serif;--sans:'Noto Sans TC',sans-serif;
  --r:6px;--rl:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);min-height:100vh;}

/* NAV */
nav{background:var(--paper-c);border-bottom:1px solid var(--border);padding:0 24px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.nav-logo{height:36px;width:auto;}
.nav-links{display:flex;gap:12px;align-items:center;}
.nav-link{font-size:12px;color:var(--ink-l);text-decoration:none;letter-spacing:1px;padding:4px 8px;border-radius:var(--r);}
.nav-link.active{color:var(--sage-dk);font-weight:500;}

/* MAIN */
.main{max-width:1100px;margin:0 auto;padding:24px;}

/* PANELS */
.panel{display:none;} .panel.on{display:block;}

/* CARDS */
.card{background:var(--paper-c);border:1px solid var(--border-l);border-radius:var(--rl);overflow:hidden;margin-bottom:16px;}
.card-hd{padding:12px 18px;border-bottom:1px solid var(--border-l);background:var(--paper-w);display:flex;align-items:center;justify-content:space-between;}
.card-hd h3{font-family:var(--serif);font-size:13px;font-weight:400;color:var(--ink-m);letter-spacing:2px;}

/* CONTRACT LIST */
.contract-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;}
.contract-card{background:var(--paper-c);border:1px solid var(--border-l);border-radius:var(--rl);overflow:hidden;cursor:pointer;transition:all .2s;}
.contract-card:hover{border-color:var(--sage-dk);box-shadow:0 4px 16px rgba(0,0,0,.08);}
.contract-type-stripe{height:4px;}
.contract-body{padding:16px;}
.contract-no{font-size:10px;color:var(--ink-l);letter-spacing:2px;margin-bottom:4px;}
.contract-name{font-family:var(--serif);font-size:15px;color:var(--ink);margin-bottom:6px;}
.contract-client{font-size:12px;color:var(--ink-l);}
.contract-footer{padding:10px 16px;border-top:1px solid var(--border-l);display:flex;align-items:center;justify-content:space-between;background:var(--paper-w);}

/* STATUS BADGES */
.badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:10px;letter-spacing:1px;}
.badge-draft{background:#f5f5f5;color:var(--stone);}
.badge-pending{background:var(--gold-pa);color:var(--gold);}
.badge-signed{background:var(--green-pa);color:var(--green);}
.badge-terminated{background:var(--red-pa);color:var(--red);}

/* TYPE COLORS */
.type-design{background:var(--blue);}
.type-work{background:var(--sage-dk);}
.type-combined{background:#5c4a8a;}
.type-sub{background:var(--gold);}

/* FORM */
.fg{margin-bottom:14px;}
.fg label{display:block;font-size:11px;color:var(--ink-l);letter-spacing:1px;margin-bottom:5px;}
.fc{width:100%;border:1px solid var(--border);border-radius:var(--r);padding:8px 12px;font-size:13px;font-family:var(--sans);outline:none;background:var(--paper-c);color:var(--ink);}
.fc:focus{border-color:var(--sage-dk);}
.frow{display:grid;gap:12px;}
textarea.fc{resize:vertical;min-height:80px;}

/* BUTTONS */
.btn{padding:8px 16px;border:none;border-radius:var(--r);font-size:12px;cursor:pointer;letter-spacing:1px;font-family:var(--sans);transition:all .15s;}
.btn-primary{background:var(--sage-dk);color:#fff;}
.btn-primary:hover{background:#7a8072;}
.btn-secondary{background:var(--paper-w);color:var(--ink-m);border:1px solid var(--border);}
.btn-secondary:hover{background:var(--border-l);}
.btn-danger{background:var(--red-pa);color:var(--red);border:1px solid #f5c0b0;}
.btn-accent{background:#eef0ea;color:var(--sage-dk);border:1px solid var(--sage);}
.btn-sm{padding:4px 10px;font-size:11px;}

/* MODAL */
.mbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;align-items:center;justify-content:center;}
.mbg.on{display:flex;}
.modal{background:var(--paper-c);border-radius:var(--rl);width:min(700px,95vw);max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.mhd{padding:16px 20px;border-bottom:1px solid var(--border-l);display:flex;align-items:center;justify-content:space-between;background:var(--paper-w);position:sticky;top:0;}
.mhd h3{font-family:var(--serif);font-size:15px;font-weight:400;letter-spacing:2px;}
.mcl{background:none;border:none;font-size:18px;cursor:pointer;color:var(--ink-l);line-height:1;}
.mbod{padding:20px;}
.mft{padding:14px 20px;border-top:1px solid var(--border-l);display:flex;justify-content:flex-end;gap:8px;background:var(--paper-w);}

/* CONTRACT DETAIL */
.detail-panel{display:none;position:fixed;inset:0;background:var(--paper);z-index:300;overflow-y:auto;}
.detail-nav{background:var(--paper-c);border-bottom:1px solid var(--border);padding:0 24px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;}
.detail-body{max-width:800px;margin:0 auto;padding:32px 24px;}

/* CONTRACT DOCUMENT */
.doc-section{margin-bottom:24px;}
.doc-section-title{font-family:var(--serif);font-size:13px;font-weight:500;color:var(--ink-m);letter-spacing:2px;border-bottom:1px solid var(--border-l);padding-bottom:8px;margin-bottom:14px;}
.clause-row{display:flex;gap:12px;margin-bottom:12px;align-items:flex-start;}
.clause-no{font-size:12px;color:var(--ink-l);min-width:40px;padding-top:8px;}
.clause-content{flex:1;}
.clause-title{font-size:13px;font-weight:500;color:var(--ink);margin-bottom:4px;}
.clause-text{font-size:12px;color:var(--ink-m);line-height:1.8;}

/* PRINT */
@media print{
  nav,.detail-nav,.no-print,#preview-outer>*:not(#preview-a4){display:none!important;}
  .detail-panel,#preview-panel{position:static!important;}
  #preview-outer{background:white!important;padding:0!important;}
  #preview-a4{width:100%!important;box-shadow:none!important;}
  .detail-body{padding:0;max-width:100%;}
  body{background:white;}
  @page{size:A4;margin:0;}
}

@media(max-width:600px){
  .contract-grid{grid-template-columns:1fr;}
  .main{padding:16px;}
}
</style>
</head>

<!-- 主頁面 -->
<div class="main">
  <!-- 工具列 -->
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
    <div>
      <h2 style="font-family:var(--serif);font-size:22px;font-weight:300;letter-spacing:3px;color:var(--ink);">合 約 管 理</h2>
      <p style="font-size:12px;color:var(--ink-l);margin-top:4px;letter-spacing:1px;">設計委託、工程承攬、分包合約</p>
    </div>
    <button class="btn btn-primary" onclick="openNewContract()">＋ 新建合約</button>
  </div>

  <!-- 篩選 -->
  <div style="display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;">
    <select class="fc" id="filter-type" onchange="renderList()" style="width:auto;padding:6px 12px;">
      <option value="">所有類型</option>
      <option value="design">設計委託約</option>
      <option value="work">工程承攬約</option>
      <option value="combined">設計＋工程合併約</option>
      <option value="sub">分包商協力約</option>
    </select>
    <select class="fc" id="filter-status" onchange="renderList()" style="width:auto;padding:6px 12px;">
      <option value="">所有狀態</option>
      <option value="draft">草稿</option>
      <option value="pending">待簽署</option>
      <option value="signed">已簽署</option>
      <option value="terminated">已終止</option>
    </select>
    <input class="fc" id="filter-search" placeholder="搜尋合約…" oninput="renderList()" style="width:200px;padding:6px 12px;">
  </div>

  <!-- 合約列表 -->
  <div class="contract-grid" id="contract-grid"></div>
  <div id="contract-empty" style="display:none;padding:60px;text-align:center;color:var(--ink-l);">
    <div style="font-size:32px;margin-bottom:12px;">📄</div>
    <div style="font-size:14px;margin-bottom:8px;">尚無合約</div>
    <div style="font-size:12px;">點「新建合約」開始建立第一份合約</div>
  </div>
</div>

<!-- 合約詳細頁 -->
<div class="detail-panel" id="detail-panel">
  <div class="detail-nav">
    <div style="display:flex;align-items:center;gap:12px;">
      <button class="btn btn-secondary btn-sm" onclick="closeDetail()">← 返回列表</button>
      <span id="detail-nav-title" style="font-family:var(--serif);font-size:14px;color:var(--ink-m);letter-spacing:2px;"></span>
    </div>
    <div style="display:flex;gap:8px;" class="no-print">
      <button class="btn btn-accent btn-sm" onclick="openPreview()">👁 預覽</button>
      <button class="btn btn-secondary btn-sm" onclick="printContract()">🖨️ 列印</button>
      <button class="btn btn-secondary btn-sm" onclick="exportPDF()">⬇ PDF</button>
      <button class="btn btn-accent btn-sm" onclick="openEditContract()">編輯</button>
      <button class="btn btn-danger btn-sm" onclick="deleteCurrentContract()">刪除</button>
    </div>
  </div>
  <div class="detail-body" id="detail-body"></div>
</div>

<!-- 新建/編輯合約 Modal -->
<div class="mbg" id="contract-modal">
  <div class="modal">
    <div class="mhd">
      <h3 id="modal-title">新建合約</h3>
      <button class="mcl" onclick="closeModal()">✕</button>
    </div>
    <div class="mbod">
      <input type="hidden" id="edit-id">

      <!-- 基本資訊 -->
      <div class="doc-section-title" style="margin-bottom:14px;">基本資訊</div>
      <div class="frow" style="grid-template-columns:1fr 1fr;margin-bottom:14px;">
        <div class="fg">
          <label>合約類型</label>
          <select class="fc" id="c-type" onchange="onTypeChange()">
            <option value="design">設計委託約</option>
            <option value="work">工程承攬約</option>
            <option value="combined">設計＋工程合併約</option>
            <option value="sub">分包商協力約</option>
          </select>
        </div>
        <div class="fg">
          <label>空間性質（範本）</label>
          <select class="fc" id="c-space" onchange="applyTemplate()">
            <option value="">選擇套用範本</option>
            <option value="residential">住宅（一般）</option>
            <option value="old-house">老屋改造</option>
            <option value="commercial">商業空間</option>
            <option value="office">辦公室</option>
          </select>
        </div>
      </div>
      <div class="frow" style="grid-template-columns:1fr 1fr;margin-bottom:14px;">
        <div class="fg">
          <label>合約狀態</label>
          <select class="fc" id="c-status">
            <option value="draft">草稿</option>
            <option value="pending">待簽署</option>
            <option value="signed">已簽署</option>
            <option value="terminated">已終止</option>
          </select>
        </div>
        <div class="fg">
          <label>合約日期</label>
          <input class="fc" id="c-date" type="date">
        </div>
      </div>

      <!-- 帶入既有資料 -->
      <div class="doc-section-title" style="margin-bottom:14px;">連結既有資料</div>
      <div class="frow" style="grid-template-columns:1fr 1fr;margin-bottom:14px;">
        <div class="fg">
          <label>連結客戶</label>
          <select class="fc" id="c-client" onchange="fillClientData()">
            <option value="">選擇客戶（自動帶入）</option>
          </select>
        </div>
        <div class="fg">
          <label>連結報價單</label>
          <select class="fc" id="c-quote" onchange="fillQuoteData()">
            <option value="">選擇報價單（自動帶入）</option>
          </select>
        </div>
      </div>
      <div class="fg" style="margin-bottom:14px;">
        <label>連結工程專案</label>
        <select class="fc" id="c-project" onchange="fillProjectData()">
          <option value="">選擇專案（自動帶入工期）</option>
        </select>
      </div>

      <!-- 甲方資訊（業主）-->
      <div class="doc-section-title" style="margin-bottom:14px;">甲方（委託人）</div>
      <div class="frow" style="grid-template-columns:1fr 1fr;margin-bottom:14px;">
        <div class="fg"><label>姓名</label><input class="fc" id="c-owner-name" placeholder="業主姓名"></div>
        <div class="fg"><label>電話</label><input class="fc" id="c-owner-phone" placeholder="聯絡電話"></div>
      </div>
      <div class="fg" style="margin-bottom:14px;">
        <label>地址</label><input class="fc" id="c-owner-addr" placeholder="業主地址">
      </div>
      <div class="fg" style="margin-bottom:14px;">
        <label>身分證字號／統編</label><input class="fc" id="c-owner-id" placeholder="身分證字號或統一編號">
      </div>

      <!-- 工程資訊 -->
      <div class="doc-section-title" id="work-section-title" style="margin-bottom:14px;">工程資訊</div>
      <div class="fg" style="margin-bottom:14px;">
        <label>工程地址</label><input class="fc" id="c-addr" placeholder="施工地址">
      </div>
      <div class="frow" style="grid-template-columns:1fr 1fr 1fr;margin-bottom:14px;">
        <div class="fg"><label>開工日期</label><input class="fc" id="c-start" type="date"></div>
        <div class="fg"><label>完工日期</label><input class="fc" id="c-end" type="date"></div>
        <div class="fg"><label>坪數</label><input class="fc" id="c-size" type="number" placeholder="0"></div>
      </div>
      <div class="fg" style="margin-bottom:14px;">
        <label>合約金額（元）</label>
        <input class="fc" id="c-amount" type="number" placeholder="0" oninput="recalcPayments()">
      </div>

      <!-- 付款方式（結構化） -->
      <div style="margin-bottom:14px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
          <label style="font-size:11px;color:var(--ink-l);letter-spacing:1px;">付款方式</label>
          <button class="btn btn-accent btn-sm" onclick="addPaymentRow()">＋ 新增期數</button>
        </div>
        <div id="payment-rows"></div>
        <div id="payment-ratio-hint" style="font-size:11px;color:var(--ink-l);margin-top:6px;text-align:right;"></div>
      </div>

      <!-- 工程範圍 -->
      <div class="fg" style="margin-bottom:14px;">
        <label>工程範圍說明</label>
        <textarea class="fc" id="c-scope" rows="3" placeholder="說明工程內容、工種及施作範圍…"></textarea>
      </div>

      <!-- 標準條款 -->
      <div class="doc-section-title" style="margin-bottom:14px;">標準條款（依內政部範本）</div>
      <div id="clauses-container"></div>

      <!-- 特殊條款 -->
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
        <div class="doc-section-title" style="margin-bottom:0;">特殊條款</div>
        <button class="btn btn-accent btn-sm" onclick="addClause()">＋ 新增條款</button>
      </div>
      <div id="special-clauses"></div>

      <!-- 密件設定 -->
      <div class="doc-section-title" style="margin-bottom:14px;">密件設定</div>
      <div class="fg" style="margin-bottom:8px;">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
          <input type="checkbox" id="c-confidential" onchange="toggleConfidential()" style="width:14px;height:14px;accent-color:var(--sage-dk);">
          <span style="font-size:13px;color:var(--ink);">設為密件（需輸入密碼才能開啟合約）</span>
        </label>
      </div>
      <div id="confidential-pwd-row" class="fg" style="display:none;margin-bottom:14px;">
        <label>合約密碼</label>
        <input class="fc" id="c-pwd" type="password" placeholder="設定合約密碼（至少4碼）">
      </div>

      <!-- 備註 -->
      <div class="fg">
        <label>備註</label>
        <textarea class="fc" id="c-note" rows="2" placeholder="其他說明事項…"></textarea>
      </div>
    </div>
    <div class="mft">
      <button class="btn btn-secondary" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" id="modal-submit" onclick="saveContract()">建立合約</button>
    </div>
  </div>
</div>

<!-- 密件解鎖 Modal -->

<script>
// ── PAYMENT ROWS ──
let PAYMENT_ROWS=[];

function initPaymentRows(payments){
  PAYMENT_ROWS=payments&&payments.length?payments:[
    {name:'簽約款',ratio:30},
    {name:'開工款',ratio:30},
    {name:'完工款',ratio:40}
  ];
  renderPaymentRows();
}

function addPaymentRow(){
  PAYMENT_ROWS.push({name:'期款',ratio:0});
  renderPaymentRows();
}

function removePaymentRow(i){
  PAYMENT_ROWS.splice(i,1);
  renderPaymentRows();
}

function renderPaymentRows(){
  const amount=parseFloat(document.getElementById('c-amount').value)||0;
  const totalRatio=PAYMENT_ROWS.reduce((s,r)=>s+(parseFloat(r.ratio)||0),0);
  const hint=document.getElementById('payment-ratio-hint');
  hint.textContent='比例合計：'+totalRatio+'%'+(totalRatio===100?' ✓':'（需合計100%）');
  hint.style.color=totalRatio===100?'var(--green)':'var(--red)';
  document.getElementById('payment-rows').innerHTML=PAYMENT_ROWS.map((r,i)=>{
    const rowAmt=amount?(amount*r.ratio/100):0;
    return`<div style="display:flex;gap:6px;align-items:center;margin-bottom:6px;">
      <input class="fc" style="flex:2;font-size:12px;" value="${r.name}" oninput="PAYMENT_ROWS[${i}].name=this.value" placeholder="期款名稱">
      <input class="fc" style="width:70px;text-align:center;font-size:12px;" type="number" min="0" max="100" value="${r.ratio}" oninput="PAYMENT_ROWS[${i}].ratio=parseFloat(this.value)||0;recalcPayments();" placeholder="%">
      <span style="font-size:11px;color:var(--ink-l);">%</span>
      <span style="font-size:12px;color:var(--sage-dk);min-width:90px;text-align:right;">${rowAmt?fmt(rowAmt):''}</span>
      <button class="btn btn-danger btn-sm" onclick="removePaymentRow(${i})">✕</button>
    </div>`;
  }).join('');
}

function recalcPayments(){renderPaymentRows();}

function getPaymentString(){
  return PAYMENT_ROWS.map(r=>r.name+''+r.ratio+'%').join('、');
}

// ── CONFIDENTIAL ──
function toggleConfidential(){
  const on=document.getElementById('c-confidential').checked;
  document.getElementById('confidential-pwd-row').style.display=on?'block':'none';
}

// ── UNLOCK MODAL ──
let UNLOCK_TARGET_ID=null;
const UNLOCKED_IDS={};

function tryOpenDetail(id){
  const c=getContracts().find(x=>x.id===id);if(!c)return;
  if(c.confidential&&c.pwd&&!UNLOCKED_IDS[id]){
    UNLOCK_TARGET_ID=id;
    document.getElementById('unlock-contract-name').textContent=c.ownerName?' 合約：'+c.ownerName:'';
    document.getElementById('unlock-pwd').value='';
    document.getElementById('unlock-error').style.display='none';
    document.getElementById('unlock-modal').classList.add('on');
  } else {
    openDetail(id);
  }
}

function doUnlock(){
  const c=getContracts().find(x=>x.id===UNLOCK_TARGET_ID);if(!c)return;
  const input=document.getElementById('unlock-pwd').value;
  if(input===c.pwd){
    UNLOCKED_IDS[UNLOCK_TARGET_ID]=true;
    closeUnlock();
    openDetail(UNLOCK_TARGET_ID);
  } else {
    document.getElementById('unlock-error').style.display='block';
  }
}

function closeUnlock(){
  document.getElementById('unlock-modal').classList.remove('on');
  UNLOCK_TARGET_ID=null;
}

// ── PREVIEW ──
let ATTACHMENTS={quote:null,schedule:null};

function openPreview(){
  if(!CURRENT_CONTRACT)return;
  ATTACHMENTS={quote:null,schedule:null};
  document.getElementById('attach-quote-name').textContent='';
  document.getElementById('attach-schedule-name').textContent='';
  renderPreviewA4(CURRENT_CONTRACT);
  document.getElementById('preview-panel').style.display='block';
  document.body.style.overflow='hidden';
}

function closePreview(){
  document.getElementById('preview-panel').style.display='none';
  document.body.style.overflow='hidden'; // detail panel still open
}

function loadAttachment(type,input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    ATTACHMENTS[type]={name:file.name,dataUrl:e.target.result};
    document.getElementById('attach-'+type+'-name').textContent='✓ '+file.name;
    renderPreviewA4(CURRENT_CONTRACT);
  };
  reader.readAsDataURL(file);
}

// ── STATE ──
let CURRENT_CONTRACT=null;
let EDITING_ID=null;
let SPECIAL_CLAUSES=[];
let STD_CLAUSE_TEXTS={};

// ── LIST ──
function renderList(){
  const contracts=getContracts();
  const typeFilter=document.getElementById('filter-type').value;
  const statusFilter=document.getElementById('filter-status').value;
  const searchFilter=document.getElementById('filter-search').value.toLowerCase();
  const filtered=contracts.filter(c=>
    (!typeFilter||c.type===typeFilter)&&
    (!statusFilter||c.status===statusFilter)&&
    (!searchFilter||c.ownerName?.toLowerCase().includes(searchFilter)||c.no?.toLowerCase().includes(searchFilter)||c.addr?.toLowerCase().includes(searchFilter))
  );
  const grid=document.getElementById('contract-grid');
  const empty=document.getElementById('contract-empty');
  if(!filtered.length){grid.innerHTML='';empty.style.display='block';return;}
  empty.style.display='none';
  const tc=TYPE_CONFIG;const sc=STATUS_CONFIG;
  grid.innerHTML=filtered.map(c=>{
    const type=tc[c.type]||tc.design;
    const status=sc[c.status]||sc.draft;
    const confidentialBadge=c.confidential?`<span style="font-size:10px;background:#fff0f0;color:var(--red);border:1px solid #fcc;padding:1px 6px;border-radius:8px;margin-left:4px;">🔒密件</span>`:'';
    return`<div class="contract-card" onclick="tryOpenDetail('${c.id}')">
      <div class="contract-type-stripe" style="background:${type.color};"></div>
      <div class="contract-body">
        <div class="contract-no">${c.no||'—'} · ${type.label}${confidentialBadge}</div>
        <div class="contract-name">${c.ownerName||'未填寫業主'}</div>
        <div class="contract-client">${c.addr||''}</div>
        <div style="margin-top:8px;display:flex;gap:6px;align-items:center;">
          <span class="badge ${status.cls}">${status.label}</span>
          ${c.amount?`<span style="font-size:11px;color:var(--ink-l);">${fmt(c.amount)}</span>`:''}
        </div>
      </div>
      <div class="contract-footer">
        <span style="font-size:11px;color:var(--ink-l);">${fmtDate(c.date)}</span>
        <div style="display:flex;gap:6px;" onclick="event.stopPropagation()">
          <button class="btn btn-accent btn-sm" onclick="openEditContractById('${c.id}')">編輯</button>
          <button class="btn btn-danger btn-sm" onclick="deleteContract('${c.id}')">刪除</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

// ── NEW CONTRACT ──
function openNewContract(){
  EDITING_ID=null;SPECIAL_CLAUSES=[];STD_CLAUSE_TEXTS={};
  document.getElementById('modal-title').textContent='新建合約';
  document.getElementById('modal-submit').textContent='建立合約';
  document.getElementById('edit-id').value='';
  // Reset fields
  ['c-type','c-space','c-status','c-client','c-quote','c-project'].forEach(id=>{
    const el=document.getElementById(id);if(el)el.value=el.tagName==='SELECT'?el.options[0]?.value||'':'';
  });
  ['c-date','c-owner-name','c-owner-phone','c-owner-addr','c-owner-id','c-addr','c-start','c-end','c-scope','c-payment','c-note'].forEach(id=>{
    const el=document.getElementById(id);if(el)el.value='';
  });
  document.getElementById('c-size').value='';
  document.getElementById('c-amount').value='';
  document.getElementById('c-date').value=todayStr();
  document.getElementById('c-status').value='draft';
  document.getElementById('c-confidential').checked=false;
  document.getElementById('confidential-pwd-row').style.display='none';
  document.getElementById('c-pwd').value='';
  // Fill selects
  fillSelects();
  initPaymentRows([]);
  onTypeChange();
  document.getElementById('contract-modal').classList.add('on');
}

function fillSelects(){
  const clients=getClients();
  const quotes=getQuotes();
  const projects=getProjects();
  const cSel=document.getElementById('c-client');
  cSel.innerHTML='<option value="">選擇客戶（自動帶入）</option>'+clients.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
  const qSel=document.getElementById('c-quote');
  qSel.innerHTML='<option value="">選擇報價單（自動帶入）</option>'+quotes.map(q=>`<option value="${q.id}">${q.no||'—'} ${q.clientName||''} ${q.total?fmt(q.total):''}</option>`).join('');
  const pSel=document.getElementById('c-project');
  pSel.innerHTML='<option value="">選擇專案（自動帶入工期）</option>'+projects.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');
}

function fillClientData(){
  const id=document.getElementById('c-client').value;
  if(!id)return;
  const client=getClients().find(c=>c.id===id);if(!client)return;
  document.getElementById('c-owner-name').value=client.name||'';
  document.getElementById('c-owner-phone').value=client.mob||'';
  document.getElementById('c-owner-addr').value=client.addr||'';
}

function fillQuoteData(){
  const id=document.getElementById('c-quote').value;
  if(!id){return;}
  const quote=getQuotes().find(q=>q.id===id);if(!quote)return;
  if(quote.total){
    document.getElementById('c-amount').value=quote.total;
    notify('已從報價單帶入合約金額：'+fmt(quote.total),'ok');
  }
  if(quote.project)document.getElementById('c-addr').value=quote.project;
  if(quote.clientName&&!document.getElementById('c-owner-name').value)document.getElementById('c-owner-name').value=quote.clientName;
  const payEl=document.getElementById('c-payment');
  if(!payEl.value)payEl.value='簽約30%、開工30%、完工40%';
  // Build scope from quote lines
  if(quote.lines&&quote.lines.length){
    const cats=[...new Set(quote.lines.map(l=>l.cat))].filter(Boolean);
    if(cats.length)document.getElementById('c-scope').value='工程範圍包含：'+cats.join('、')+'等工程項目。';
  }
}

function fillProjectData(){
  const id=document.getElementById('c-project').value;
  if(!id)return;
  const proj=getProjects().find(p=>p.id===id);if(!proj)return;
  if(proj.startDate)document.getElementById('c-start').value=proj.startDate;
  if(proj.endDate)document.getElementById('c-end').value=proj.endDate;
  if(proj.address&&!document.getElementById('c-addr').value)document.getElementById('c-addr').value=proj.address;
  if(proj.ownerName&&!document.getElementById('c-owner-name').value)document.getElementById('c-owner-name').value=proj.ownerName;
  if(proj.ownerPhone&&!document.getElementById('c-owner-phone').value)document.getElementById('c-owner-phone').value=proj.ownerPhone;
  if(proj.size)document.getElementById('c-size').value=proj.size;
  if(proj.budget&&!document.getElementById('c-amount').value)document.getElementById('c-amount').value=proj.budget;
}

function applyTemplate(){
  const space=document.getElementById('c-space').value;
  if(!space)return;
  const tmpl=SPACE_TEMPLATES[space];if(!tmpl)return;
  if(tmpl.scope)document.getElementById('c-scope').value=tmpl.scope;
  notify('已套用「'+document.getElementById('c-space').options[document.getElementById('c-space').selectedIndex].text+'」範本','ok');
}

function onTypeChange(){
  STD_CLAUSE_TEXTS={};  // 清空快取，確保切換類型時條款完全更新
  const type=document.getElementById('c-type').value;
  const clauses=STD_CLAUSES[type]||STD_CLAUSES.work;
  const container=document.getElementById('clauses-container');
  container.innerHTML=clauses.map((cl,i)=>`
    <div style="border:1px solid var(--border-l);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;background:var(--paper-w);">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
        <span style="font-size:11px;color:var(--ink-l);">第${i+1}條</span>
        <strong style="font-size:12px;color:var(--ink);">${cl.title}</strong>
      </div>
      <textarea class="fc std-clause" data-idx="${i}" rows="2" style="font-size:12px;">${STD_CLAUSE_TEXTS[i]!==undefined?STD_CLAUSE_TEXTS[i]:cl.text}</textarea>
    </div>`).join('');
  // Re-attach change listeners
  container.querySelectorAll('.std-clause').forEach(ta=>{
    ta.addEventListener('input',function(){STD_CLAUSE_TEXTS[this.dataset.idx]=this.value;});
  });
}

function addClause(){
  SPECIAL_CLAUSES.push({title:'特殊條款',text:''});
  renderSpecialClauses();
}

function renderSpecialClauses(){
  document.getElementById('special-clauses').innerHTML=SPECIAL_CLAUSES.map((cl,i)=>`
    <div style="border:1px solid var(--border-l);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;">
      <div style="display:flex;gap:8px;margin-bottom:6px;">
        <input class="fc" value="${cl.title}" oninput="SPECIAL_CLAUSES[${i}].title=this.value" style="font-size:12px;font-weight:500;" placeholder="條款名稱">
        <button class="btn btn-danger btn-sm" onclick="removeClause(${i})">✕</button>
      </div>
      <textarea class="fc" rows="2" style="font-size:12px;" oninput="SPECIAL_CLAUSES[${i}].text=this.value" placeholder="條款內容…">${cl.text}</textarea>
    </div>`).join('');
}

function removeClause(i){SPECIAL_CLAUSES.splice(i,1);renderSpecialClauses();}

// ── SAVE ──
function saveContract(){
  const type=document.getElementById('c-type').value;
  const ownerName=document.getElementById('c-owner-name').value.trim();
  if(!ownerName){notify('請填寫甲方姓名','err');return;}
  // Collect std clauses
  const stdClauses=(STD_CLAUSES[type]||STD_CLAUSES.work).map((cl,i)=>{
    const ta=document.querySelector(`.std-clause[data-idx="${i}"]`);
    return{title:cl.title,text:ta?ta.value:cl.text};
  });
  const contracts=getContracts();
  const isEdit=!!EDITING_ID;
  const existing=isEdit?contracts.find(c=>c.id===EDITING_ID):null;
  const seq=contracts.length+1;
  const typePrefix={design:'DC',work:'WC',combined:'CC',sub:'SC'};
  const no=existing?.no||(typePrefix[type]||'CT')+String(seq).padStart(3,'0');
  const contract={
    id:EDITING_ID||uid(),no,
    type:type,status:document.getElementById('c-status').value,
    date:document.getElementById('c-date').value,
    clientId:document.getElementById('c-client').value,
    quoteId:document.getElementById('c-quote').value,
    projectId:document.getElementById('c-project').value,
    ownerName,
    ownerPhone:document.getElementById('c-owner-phone').value,
    ownerAddr:document.getElementById('c-owner-addr').value,
    ownerId:document.getElementById('c-owner-id').value,
    addr:document.getElementById('c-addr').value,
    startDate:document.getElementById('c-start').value,
    endDate:document.getElementById('c-end').value,
    size:document.getElementById('c-size').value,
    amount:parseFloat(document.getElementById('c-amount').value)||0,
    payment:getPaymentString(),
    payments:PAYMENT_ROWS.map(r=>({name:r.name,ratio:parseFloat(r.ratio)||0})),
    confidential:document.getElementById('c-confidential').checked,
    pwd:document.getElementById('c-confidential').checked?document.getElementById('c-pwd').value:'',
    scope:document.getElementById('c-scope').value,
    stdClauses,specialClauses:SPECIAL_CLAUSES,
    note:document.getElementById('c-note').value,
    createdAt:existing?.createdAt||todayStr()
  };
  if(isEdit){const i=contracts.findIndex(c=>c.id===EDITING_ID);contracts.splice(i,1,contract);}
  else contracts.unshift(contract);
  saveContracts(contracts);
  closeModal();renderList();
  notify(isEdit?'合約已更新':'合約已建立','ok');
}

function closeModal(){document.getElementById('contract-modal').classList.remove('on');EDITING_ID=null;}

// ── EDIT ──
function openEditContractById(id){
  const c=getContracts().find(x=>x.id===id);if(!c)return;
  EDITING_ID=id;SPECIAL_CLAUSES=[...(c.specialClauses||[])];
  STD_CLAUSE_TEXTS={};
  document.getElementById('modal-title').textContent='編輯合約';
  document.getElementById('modal-submit').textContent='更新合約';
  document.getElementById('edit-id').value=id;
  fillSelects();
  document.getElementById('c-type').value=c.type||'design';
  document.getElementById('c-status').value=c.status||'draft';
  document.getElementById('c-date').value=c.date||'';
  document.getElementById('c-client').value=c.clientId||'';
  document.getElementById('c-quote').value=c.quoteId||'';
  document.getElementById('c-project').value=c.projectId||'';
  document.getElementById('c-owner-name').value=c.ownerName||'';
  document.getElementById('c-owner-phone').value=c.ownerPhone||'';
  document.getElementById('c-owner-addr').value=c.ownerAddr||'';
  document.getElementById('c-owner-id').value=c.ownerId||'';
  document.getElementById('c-addr').value=c.addr||'';
  document.getElementById('c-start').value=c.startDate||'';
  document.getElementById('c-end').value=c.endDate||'';
  document.getElementById('c-size').value=c.size||'';
  document.getElementById('c-scope').value=c.scope||'';
  document.getElementById('c-amount').value=c.amount||'';
  document.getElementById('c-note').value=c.note||'';
  document.getElementById('c-confidential').checked=!!c.confidential;
  document.getElementById('confidential-pwd-row').style.display=c.confidential?'block':'none';
  document.getElementById('c-pwd').value=c.pwd||'';
  // Load std clause texts
  (c.stdClauses||[]).forEach((cl,i)=>{STD_CLAUSE_TEXTS[i]=cl.text;});
  onTypeChange();
  initPaymentRows(c.payments&&c.payments.length?c.payments:null);
  renderSpecialClauses();
  document.getElementById('contract-modal').classList.add('on');
}

function openEditContract(){
  if(!CURRENT_CONTRACT)return;
  // 不關閉詳細頁，直接在 modal 中編輯
  openEditContractById(CURRENT_CONTRACT.id);
}

// ── DELETE ──
function deleteContract(id){
  if(!confirm('確定刪除此合約？此動作無法復原。'))return;
  const contracts=getContracts().filter(c=>c.id!==id);
  saveContracts(contracts);renderList();notify('合約已刪除','ok');
}

function deleteCurrentContract(){
  if(!CURRENT_CONTRACT)return;
  if(!confirm('確定刪除此合約？'))return;
  deleteContract(CURRENT_CONTRACT.id);
  closeDetail();
}

// ── DETAIL VIEW ──
function openDetail(id){
  const c=getContracts().find(x=>x.id===id);if(!c)return;
  CURRENT_CONTRACT=c;
  const type=TYPE_CONFIG[c.type]||TYPE_CONFIG.design;
  const status=STATUS_CONFIG[c.status]||STATUS_CONFIG.draft;

    <div style="font-size:13px;color:var(--ink-m);line-height:1.8;padding:12px;background:var(--paper-w);border-radius:var(--r);">${c.scope}</div>
  </div>`:''}

  <div style="margin-bottom:24px;">
    <div class="doc-section-title">契約條款</div>
    ${(c.stdClauses||[]).map((cl,i)=>`
      <div style="margin-bottom:12px;">
        <div style="font-size:12px;font-weight:500;color:var(--ink);margin-bottom:4px;">第${i+1}條　${cl.title}</div>
        <div style="font-size:12px;color:var(--ink-m);line-height:1.9;padding:8px 12px;background:var(--paper-w);border-radius:var(--r);">${cl.text}</div>
      </div>`).join('')}
    ${(c.specialClauses||[]).map((cl,i)=>`
      <div style="margin-bottom:12px;">
        <div style="font-size:12px;font-weight:500;color:var(--ink);margin-bottom:4px;">特殊條款${i+1}　${cl.title}</div>
        <div style="font-size:12px;color:var(--ink-m);line-height:1.9;padding:8px 12px;background:var(--paper-w);border-radius:var(--r);">${cl.text}</div>
      </div>`).join('')}
  </div>

  ${c.note?`<div style="margin-bottom:24px;">
    <div class="doc-section-title">備註</div>
    <div style="font-size:12px;color:var(--ink-m);line-height:1.8;">${c.note}</div>
  </div>`:''}

  <div style="margin-top:48px;display:grid;grid-template-columns:1fr 1fr;gap:40px;">
    <div style="border-top:1px solid var(--ink);padding-top:8px;">
      <div style="font-size:12px;color:var(--ink-l);margin-bottom:20px;">甲方簽署</div>
      <div style="font-size:12px;color:var(--ink-l);">姓名：${c.ownerName||'________________'}</div>
      <div style="font-size:12px;color:var(--ink-l);margin-top:8px;">日期：________________</div>
      <div style="font-size:12px;color:var(--ink-l);margin-top:8px;">印章：</div>
    </div>
    <div style="border-top:1px solid var(--ink);padding-top:8px;">
      <div style="font-size:12px;color:var(--ink-l);margin-bottom:20px;">乙方簽署</div>
      <div style="font-size:12px;color:var(--ink-l);">得森室內裝修設計有限公司</div>
      <div style="font-size:12px;color:var(--ink-l);margin-top:8px;">代表人：郭明彰</div>
      <div style="font-size:12px;color:var(--ink-l);margin-top:8px;">日期：________________</div>
    </div>
  </div>`;
}

function printContract(){window.print();}
function exportPDF(){window.print();}

renderList();
