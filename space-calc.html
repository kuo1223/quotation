<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>空間基本條件換算器 — 得森設計</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ── TOKENS ── */
:root{
  --bg:#f4f3f0;--surface:#fff;--surface2:#f9f8f6;--surface3:#f0efe9;
  --border:#e2e0da;--border2:#d4d1c9;
  --ink:#2b2926;--ink-m:#4a4742;--ink-l:#8a8780;--ink-f:#c8c4be;
  --sage:#8a9082;--sage-lt:#eef0ea;--sage-dk:#6e7a6a;--sage-pa:#d8dcd4;
  --amber:#c8960a;--amber-lt:#fef9e7;
  --blue-lt:#eaf1fb;--blue:#3a6ea8;
  --red:#c0392b;
  --serif:'Noto Serif TC',serif;--sans:'Noto Sans TC',sans-serif;
  --r:8px;--rl:12px;--sh:0 1px 8px rgba(0,0,0,.06);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:13px;}
body{display:flex;flex-direction:column;}

/* ── HEADER ── */
header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;height:54px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.hd-left{display:flex;align-items:center;gap:10px;}
.hd-logo{height:32px;}
.hd-brand{font-family:var(--serif);font-size:11px;color:var(--ink-m);letter-spacing:2px;border-left:1px solid var(--border);padding-left:10px;}
.hd-title{font-family:var(--serif);font-size:14px;letter-spacing:3px;border-left:1px solid var(--border);padding-left:10px;}
.hd-right{display:flex;gap:8px;align-items:center;}
.hbtn{padding:6px 13px;border-radius:var(--r);font-size:11px;font-family:var(--sans);cursor:pointer;border:none;letter-spacing:.5px;transition:all .18s;white-space:nowrap;}
.hbtn-ghost{background:var(--surface2);color:var(--ink-m);border:1px solid var(--border);}
.hbtn-ghost:hover{border-color:var(--sage);color:var(--sage-dk);}
.hbtn-sage{background:var(--sage-lt);color:var(--sage-dk);border:1px solid var(--sage-pa);}
.hbtn-sage:hover{background:var(--sage-dk);color:#fff;}
.hbtn-primary{background:var(--sage-dk);color:#fff;}
.hbtn-primary:hover{background:#5a6a58;}
.back-btn{font-size:11px;color:var(--ink-l);text-decoration:none;padding:5px 10px;border-radius:var(--r);transition:all .15s;}
.back-btn:hover{background:var(--surface3);color:var(--ink);}

/* ── LAYOUT ── */
.workspace{display:grid;grid-template-columns:320px 1fr;flex:1;min-height:0;overflow:hidden;}
.panel-l{overflow-y:auto;padding:14px;background:var(--bg);border-right:1px solid var(--border);height:calc(100vh - 54px);}
.panel-r{overflow-y:auto;padding:14px;background:var(--bg);height:calc(100vh - 54px);}

/* ── CARDS ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);margin-bottom:10px;overflow:hidden;box-shadow:var(--sh);}
.card-hd{padding:9px 14px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px;}
.card-icon{font-size:13px;}
.card-title{font-family:var(--serif);font-size:11px;font-weight:400;color:var(--ink-m);letter-spacing:2px;flex:1;}
.card-body{padding:12px 14px;}

/* ── SPACE TABS ── */
.space-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center;}
.sp-tab{padding:5px 12px;border-radius:20px;font-size:11px;cursor:pointer;border:1px solid var(--border2);background:var(--surface);color:var(--ink-m);transition:all .15s;white-space:nowrap;}
.sp-tab:hover{border-color:var(--sage);}
.sp-tab.active{background:var(--sage-dk);border-color:var(--sage-dk);color:#fff;}
.sp-tab-add{padding:5px 10px;border-radius:20px;font-size:11px;cursor:pointer;border:1px dashed var(--border2);background:transparent;color:var(--ink-l);transition:all .15s;}
.sp-tab-add:hover{border-color:var(--sage);color:var(--sage-dk);}

/* ── FORM ── */
.field{margin-bottom:10px;}
.field:last-child{margin-bottom:0;}
.field-label{font-size:10px;color:var(--ink-l);letter-spacing:.8px;margin-bottom:3px;display:flex;justify-content:space-between;}
.field-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;}
.field-row2{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
input[type=number],input[type=text],select,textarea{width:100%;border:1px solid var(--border2);border-radius:var(--r);padding:6px 8px;font-size:12px;font-family:var(--sans);color:var(--ink);background:var(--surface);outline:none;transition:border-color .15s;}
input:focus,select:focus,textarea:focus{border-color:var(--sage);}
.unit-toggle{display:flex;gap:0;border:1px solid var(--border2);border-radius:var(--r);overflow:hidden;}
.unit-btn{padding:4px 10px;font-size:11px;cursor:pointer;border:none;background:var(--surface2);color:var(--ink-l);font-family:var(--sans);transition:all .15s;}
.unit-btn.active{background:var(--sage-dk);color:#fff;}
.computed-row{display:flex;justify-content:space-between;padding:5px 8px;background:var(--surface3);border-radius:var(--r);margin-top:4px;}
.computed-label{font-size:10px;color:var(--ink-l);}
.computed-val{font-size:12px;font-weight:500;color:var(--sage-dk);font-family:var(--serif);}

/* opening rows */
.opening-row{display:flex;align-items:center;gap:5px;margin-bottom:5px;}
.opening-row input{width:60px;}
.opening-del{background:none;border:none;color:var(--ink-f);cursor:pointer;font-size:14px;padding:0 2px;}
.opening-del:hover{color:var(--red);}
.sep{font-size:11px;color:var(--ink-l);}
.add-opening-btn{font-size:11px;color:var(--sage-dk);background:none;border:1px dashed var(--sage-pa);border-radius:var(--r);padding:4px 10px;cursor:pointer;font-family:var(--sans);}
.add-opening-btn:hover{background:var(--sage-lt);}

/* chips */
.chip-group{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px;}
.chip{padding:3px 9px;border-radius:16px;font-size:11px;cursor:pointer;border:1px solid var(--border2);background:var(--surface2);color:var(--ink-m);user-select:none;transition:all .15s;}
.chip:hover{border-color:var(--sage);}
.chip.active{background:var(--sage-lt);border-color:var(--sage-dk);color:var(--sage-dk);}

/* ── RIGHT: SCREEN RESULTS ── */
.sp-result-block{margin-bottom:14px;}
.sp-result-hd{font-family:var(--serif);font-size:15px;color:var(--ink);letter-spacing:2px;padding:8px 0 8px;border-bottom:2px solid var(--sage-dk);margin-bottom:10px;display:flex;align-items:baseline;gap:8px;}
.sp-result-hd-use{font-size:11px;color:var(--ink-l);font-family:var(--sans);letter-spacing:1px;}

.section-hd{display:flex;align-items:center;gap:6px;margin-bottom:7px;margin-top:12px;}
.section-icon{font-size:13px;}
.section-title{font-family:var(--serif);font-size:11px;color:var(--ink-m);letter-spacing:2px;}

.metric-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px;}
.metric-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:6px;}
.metric-cell{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:9px 12px;box-shadow:var(--sh);}
.metric-cell.accent{background:var(--sage-lt);border-color:var(--sage-pa);}
.metric-cell.amber{background:var(--amber-lt);border-color:rgba(200,150,10,.2);}
.metric-label{font-size:10px;color:var(--ink-l);margin-bottom:3px;letter-spacing:.5px;}
.metric-val{font-family:var(--serif);font-size:20px;color:var(--ink);line-height:1;}
.metric-val.sm{font-size:15px;}
.metric-val .unit{font-size:11px;color:var(--ink-l);margin-left:2px;}
.metric-sub{font-size:10px;color:var(--ink-f);margin-top:2px;}
.copy-btn{float:right;font-size:10px;color:var(--ink-f);background:none;border:1px solid var(--border);border-radius:4px;padding:1px 6px;cursor:pointer;margin-top:2px;}
.copy-btn:hover{color:var(--sage-dk);border-color:var(--sage);}
.lux-note{font-size:10px;color:var(--sage-dk);background:var(--sage-lt);border:1px solid var(--sage-pa);border-radius:var(--r);padding:5px 10px;margin-top:4px;}
.ac-notice{font-size:10px;color:var(--amber);background:var(--amber-lt);border:1px solid rgba(200,150,10,.2);border-radius:var(--r);padding:5px 10px;margin-top:4px;}
.sp-divider{border:none;border-top:1px solid var(--border);margin:16px 0;}

/* ── OUTPUT SETTINGS PANEL ── */
.output-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:12px 14px;margin-bottom:10px;box-shadow:var(--sh);}
.output-panel-title{font-family:var(--serif);font-size:11px;color:var(--ink-m);letter-spacing:2px;margin-bottom:8px;}
.output-checks{display:flex;flex-direction:column;gap:5px;margin-bottom:10px;}
.output-check{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-m);cursor:pointer;user-select:none;}
.output-check input{accent-color:var(--sage-dk);width:14px;height:14px;cursor:pointer;}
.output-btns{display:flex;gap:7px;}

/* ── PRINT / EXPORT ── */
#printFrame{display:none;}
@media print{
  body>*{display:none!important;}
  #printFrame{display:block!important;position:fixed;top:0;left:0;width:100%;height:100%;border:none;}
}

/* ══ MOBILE RWD ══ */
@media(max-width:768px){
  header{height:auto;padding:10px 14px;flex-wrap:wrap;gap:8px;}
  .hd-left{flex-wrap:wrap;gap:6px;}
  .hd-brand{font-size:10px;letter-spacing:1px;padding-left:8px;}
  .hd-title{font-size:12px;letter-spacing:2px;padding-left:8px;}
  .hd-logo{height:28px;}
  .hd-right{gap:6px;}
  .hbtn{padding:5px 10px;font-size:11px;}
  .back-btn{padding:5px 8px;font-size:11px;}

  .workspace{grid-template-columns:1fr;height:auto;overflow:visible;}
  .panel-l{height:auto;overflow:visible;border-right:none;border-bottom:1px solid var(--border);}
  .panel-r{height:auto;overflow:visible;}

  .space-tabs{gap:5px;}
  .sp-tab{padding:4px 10px;font-size:11px;}
  .sp-tab-add{padding:4px 8px;font-size:11px;}

  .field-row3{grid-template-columns:1fr 1fr 1fr;}
  .field-row2{grid-template-columns:1fr 1fr;}

  /* Results */
  .metric-grid-2{grid-template-columns:1fr 1fr;}
  .metric-grid-3{grid-template-columns:1fr 1fr;}
  .metric-cell{padding:8px 10px;}
  .metric-val{font-size:16px;}

  /* Output panel */
  .output-panel{padding:10px 12px;}
  .output-btns{flex-direction:column;}
  .output-btns .hbtn{width:100%;}

  /* Section */
  .sp-result-hd{font-size:13px;}
  .section-hd{margin-top:10px;}
}

::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}

/* DRAFT DRAWER */
.backdrop{display:none;position:fixed;inset:0;background:rgba(43,41,38,.4);z-index:200;}
.backdrop.open{display:block;}
.drawer{position:fixed;top:0;right:-440px;width:420px;height:100vh;background:var(--surface);border-left:1px solid var(--border);z-index:201;display:flex;flex-direction:column;transition:right .26s cubic-bezier(.4,0,.2,1);box-shadow:-6px 0 24px rgba(0,0,0,.1);}
.drawer.open{right:0;}
.drawer-hd{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.drawer-title{font-family:var(--serif);font-size:15px;font-weight:400;color:var(--ink);letter-spacing:2px;}
.drawer-close{background:none;border:none;font-size:18px;color:var(--ink-l);cursor:pointer;padding:2px 6px;border-radius:4px;}
.drawer-close:hover{color:var(--ink);background:var(--surface3);}
.drawer-save{padding:12px 18px;border-bottom:1px solid var(--border);flex-shrink:0;}
.d-save-row{display:flex;gap:7px;}
.d-save-input{flex:1;border:1px solid var(--border);border-radius:var(--r);padding:7px 10px;font-size:12px;font-family:var(--sans);color:var(--ink);background:var(--surface2);outline:none;}
.d-save-input:focus{border-color:var(--sage);}
.d-save-btn{padding:7px 14px;background:var(--sage-dk);color:#fff;border:none;border-radius:var(--r);font-size:12px;font-family:var(--sans);cursor:pointer;}
.d-save-btn:hover{background:#5a6a58;}
.drawer-list{flex:1;overflow-y:auto;padding:12px 18px;display:flex;flex-direction:column;gap:9px;}
.draft-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--rl);padding:12px 14px;transition:border-color .15s;}
.draft-card:hover{border-color:var(--sage);}
.draft-name{font-family:var(--serif);font-size:14px;color:var(--ink);margin-bottom:3px;}
.draft-meta{font-size:10px;color:var(--ink-l);margin-bottom:9px;}
.draft-acts{display:flex;gap:7px;}
.d-btn{padding:5px 12px;border-radius:var(--r);font-size:11px;font-family:var(--sans);cursor:pointer;border:none;}
.d-btn-load{background:var(--sage-lt);color:var(--sage-dk);border:1px solid var(--sage-pa);}
.d-btn-load:hover{background:var(--sage-dk);color:#fff;}
.d-btn-del{background:var(--red-lt);color:var(--red);border:1px solid rgba(192,57,43,.2);}
.d-btn-del:hover{background:var(--red);color:#fff;}
.drawer-empty{text-align:center;padding:36px 16px;color:var(--ink-f);font-size:12px;line-height:1.8;}
@media(max-width:768px){.drawer{width:100%;right:-100%;}.drawer.open{right:0;}}
</style>
</head>

<script>
// ══════════════════════════════════════════════
// DATA
// ══════════════════════════════════════════════
const USE_CONFIG = {
  living:  {label:'客廳',   lux:150, ach:3,  achNote:'一般起居空間'},
  bedroom: {label:'臥室',   lux:100, ach:3,  achNote:'睡眠空間，建議靜音型'},
  dining:  {label:'餐廳',   lux:300, ach:5,  achNote:'用餐空間'},
  kitchen: {label:'廚房',   lux:500, ach:15, achNote:'烹飪油煙排除'},
  bath:    {label:'衛浴',   lux:200, ach:15, achNote:'濕區強制排氣'},
  corridor:{label:'走廊',   lux:100, ach:3,  achNote:'過渡空間'},
  study:   {label:'書房',   lux:500, ach:5,  achNote:'閱讀工作空間'},
  custom:  {label:'自訂',   lux:150, ach:5,  achNote:'依實際需求調整'},
};
const AC_MODELS=[1.4,2.0,2.5,2.8,3.6,4.1,5.0,5.6,7.1,8.0];
const CT_MAP={living:'3000K 暖白',bedroom:'2700K 燭光暖白',dining:'2700K 燭光暖白',kitchen:'4000K 中性白',bath:'4000K 中性白',corridor:'3000K 暖白',study:'4000K 中性白',custom:'3000K 暖白'};

// ── STATE ─────────────────────────────────────
let unit='cm';
let spaces=[]; // [{id,name,use,customUse,L,W,H,openings,chips,lux,wallU,openingCounter}]
let activeSpId=null;
let spCounter=0;

// ── INIT ──────────────────────────────────────
document.addEventListener('DOMContentLoaded',()=>{
  addSpace();
});

// ── SPACE MANAGEMENT ──────────────────────────
function addSpace(){
  const id=++spCounter;
  spaces.push({
    id,name:'空間 '+id,
    use:'living',customUse:'',
    L:unit==='m'?4:400, W:unit==='m'?3:300, H:unit==='m'?2.7:270,
    wallU:0.4,
    openings:[],openingCounter:0,
    chips:new Set(),
    lux:null // null = use USE_CONFIG default
  });
  activeSpId=id;
  renderTabs();
  renderEditor();
  renderAll();
}

function removeSpace(id){
  if(spaces.length<=1){showToast('至少保留一個空間');return;}
  spaces=spaces.filter(s=>s.id!==id);
  if(activeSpId===id) activeSpId=spaces[0].id;
  renderTabs();renderEditor();renderAll();
}

function switchSpace(id){
  activeSpId=id;
  renderTabs();renderEditor();
}

function getSp(id){ return spaces.find(s=>s.id===id); }
function getActive(){ return getSp(activeSpId); }

// ── TABS ──────────────────────────────────────
function renderTabs(){
  const wrap=document.getElementById('spaceTabs');
  wrap.innerHTML='';
  spaces.forEach(sp=>{
    const btn=document.createElement('div');
    btn.className='sp-tab'+(sp.id===activeSpId?' active':'');
    btn.textContent=sp.name||('空間 '+sp.id);
    btn.onclick=()=>switchSpace(sp.id);
    wrap.appendChild(btn);
  });
  const addBtn=document.createElement('button');
  addBtn.className='sp-tab-add';
  addBtn.textContent='＋ 新增空間';
  addBtn.onclick=addSpace;
  wrap.appendChild(addBtn);
}

// ── EDITOR ────────────────────────────────────
function renderEditor(){
  const sp=getActive(); if(!sp) return;
  const el=document.getElementById('spaceEditor');
  const uHint=unit==='m'?'m':'cm';
  const Lv=sp.L, Wv=sp.W, Hv=sp.H;
  const step=unit==='m'?'0.01':'1';

  el.innerHTML=`
  <div class="card">
    <div class="card-hd">
      <span class="card-icon">🏠</span>
      <span class="card-title" id="ed-title">${sp.name}</span>
      ${spaces.length>1?`<button onclick="removeSpace(${sp.id})" style="margin-left:auto;background:none;border:none;color:var(--ink-f);cursor:pointer;font-size:14px;">×</button>`:''}
    </div>
    <div class="card-body">
      <div class="field">
        <div class="field-label">空間名稱</div>
        <input type="text" value="${sp.name}" oninput="getActive().name=this.value;renderTabs();renderAll()">
      </div>
      <div class="field">
        <div class="field-label">空間用途</div>
        <select id="ed-use" onchange="onUseChange(this.value)">
          ${Object.entries(USE_CONFIG).map(([k,v])=>`<option value="${k}" ${sp.use===k?'selected':''}>${v.label}</option>`).join('')}
        </select>
      </div>
      ${sp.use==='custom'?`
      <div class="field">
        <div class="field-label">自訂用途名稱</div>
        <input type="text" value="${sp.customUse}" placeholder="例：更衣室" oninput="getActive().customUse=this.value;renderAll()">
      </div>`:''}
      <div class="field">
        <div class="field-label">長 / 寬 / 高 <span>${uHint}</span></div>

function addOpening(){
  const sp=getActive();
  sp.openingCounter++;
  sp.openings.push({id:sp.openingCounter,w:90,h:210});
  renderOpenings();renderAll();
}
function removeOpening(id){
  const sp=getActive();
  sp.openings=sp.openings.filter(o=>o.id!==id);

}
function renderOpenings(){
  const sp=getActive();
  const wrap=document.getElementById('ed-openings');

    const row=document.createElement('div');

      `<span class="sep" style="min-width:16px;font-size:10px;color:var(--ink-f);">${o.id}.</span>`+

// ── UNIT ──────────────────────────────────────
function setUnit(u,btn){
  const old=unit; unit=u;
  document.querySelectorAll('.unit-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  spaces.forEach(sp=>{
    if(old==='cm'&&u==='m'){sp.L=sp.L/100;sp.W=sp.W/100;sp.H=sp.H/100;}
    else if(old==='m'&&u==='cm'){sp.L=Math.round(sp.L*100);sp.W=Math.round(sp.W*100);sp.H=Math.round(sp.H*100);}
  });
  renderEditor();renderAll();
}

// ── CALC PER SPACE ────────────────────────────
function calcSpace(sp){
  const Lcm=unit==='m'?sp.L*100:sp.L;
  const Wcm=unit==='m'?sp.W*100:sp.W;
  const Hcm=unit==='m'?sp.H*100:sp.H;
  if(!Lcm||!Wcm||!Hcm) return null;

  const Lm=Lcm/100,Wm=Wcm/100,Hm=Hcm/100;
  const area=Lm*Wm, ping=area/3.30579, ft2=area*10.7639, vol=area*Hm;
  const wallGross=2*(Lm+Wm)*Hm;
  const openAreaM2=sp.openings.reduce((s,o)=>s+(o.w/100)*(o.h/100),0);
  const wallNet=Math.max(0,wallGross-openAreaM2);
  const totalSurface=wallNet+area; // 牆面淨面積 + 天花板面積
  const totalSurfacePing=totalSurface/3.30579;
  const ratio=Lm>Wm?Lm/Wm:Wm/Lm;
  const rcr=(5*Hm*(Lm+Wm))/(Lm*Wm);

  const cfg=USE_CONFIG[sp.use]||USE_CONFIG.custom;
  const U=sp.wallU; const M=0.8;
  let Ueff=U;
  if(rcr>6) Ueff=U*0.75; else if(rcr>4) Ueff=U*0.88;
  const targetLux=sp.lux!==null?sp.lux:cfg.lux;
  const totalLm=(targetLux*area)/(Ueff*M);
  const ping1=Math.min(Math.ceil(totalLm/800),Math.ceil(ping*1.5));
  const lamp2=Math.ceil(totalLm/1000);
  const stripM=Math.round(totalLm/1000*10)/10;

  const baseKcal=ping*500;
  let adj=1;
  if(sp.chips.has('west')) adj+=0.20;
  if(sp.chips.has('roof')) adj+=0.20;
  if(sp.chips.has('high')) adj+=0.15;
  if(sp.chips.has('many')) adj+=0.10;
  const adjKcal=Math.round(baseKcal*adj);
  const kw=adjKcal/860;
  const model=AC_MODELS.find(m=>m>=kw)||AC_MODELS[AC_MODELS.length-1];
  const tons=model/3.517;

  const ach=cfg.ach;
  const cmh=Math.round(vol*ach);
  let fanSpec='';
  if(cmh<=100) fanSpec='小型浴室風扇 (≤100 CMH)';
  else if(cmh<=200) fanSpec='標準排風扇 (≤200 CMH)';
  else if(cmh<=400) fanSpec='中型換氣扇 (≤400 CMH)';
  else if(cmh<=800) fanSpec='工業換氣扇 (≤800 CMH)';
  else fanSpec='全熱交換機 ('+cmh+' CMH)';

  const ct=CT_MAP[sp.use]||'3000K 暖白';
  const useLabel=sp.use==='custom'?(sp.customUse||'自訂'):cfg.label;
  const ratioLabel=ratio<=1.3?'接近正方形':ratio<=1.8?'略長形':'細長形';
  const rcrLabel=rcr<2?'低（大空間效率佳）':rcr<4?'中（一般空間）':rcr<7?'偏高（注意光衰）':'高（燈具效率降低）';
  const hLabel=Hcm<240?'偏低':Hcm<280?'標準淨高':Hcm<320?'舒適高度':Hcm<400?'高挑空間':'挑高空間';

  return {Lm,Wm,Hm,Lcm,Wcm,Hcm,area,ping,ft2,vol,wallNet,wallGross,openAreaM2,totalSurface,totalSurfacePing,
    ratio,ratioLabel,rcr,rcrLabel,hLabel,
    Ueff,U,targetLux,totalLm,ping1,lamp2,stripM,ct,useLabel,cfg,
    baseKcal,adjKcal,adj,kw,model,tons,ach,cmh,fanSpec};
}

// ── RENDER ALL RESULTS ────────────────────────
function renderAll(){
  const panel=document.getElementById('resultsPanel');
  const calcs=spaces.map(sp=>({sp,r:calcSpace(sp)})).filter(x=>x.r);
  if(!calcs.length){
    panel.innerHTML='<div style="text-align:center;padding:40px;color:var(--ink-f);font-size:12px;">新增空間後將顯示計算結果</div>';
    return;
  }
  panel.innerHTML=calcs.map(({sp,r},i)=>renderSpaceResult(sp,r,i,calcs.length)).join('<hr class="sp-divider">');
}

function f2(v){return(Math.round(v*100)/100);}
function mc(label,val,unit2,sub,cls=''){
  return `<div class="metric-cell ${cls}"><div class="metric-label">${label}</div><div class="metric-val">${val}<span class="unit">${unit2}</span></div>${sub?`<div class="metric-sub">${sub}</div>`:''}</div>`;
}

async function exportJPG(){
  showToast('報表產生中，請稍候…');
  const printHTML=buildPrintHTML();
  const iframe=document.getElementById('printFrame');
  iframe.style.cssText='position:fixed;top:-9999px;left:0;width:1000px;height:auto;border:none;display:block;';
  iframe.srcdoc=printHTML;
  await new Promise(r=>iframe.onload=r);
  await new Promise(r=>setTimeout(r,600));

  if(typeof html2canvas==='undefined'){
    await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s);});
  }
  const target=iframe.contentDocument.body;
  const canvas=await html2canvas(target,{scale:2,useCORS:true,backgroundColor:'#ffffff',
    width:target.scrollWidth,height:target.scrollHeight,windowWidth:1000});
  iframe.style.display='none';

  const proj=document.getElementById('f-project').value.trim()||'空間換算';
  const fileName='空間條件換算_'+proj+'.jpg';
  const dataUrl=canvas.toDataURL('image/jpeg',0.93);

  const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
  if(isIOS){
    const w=window.open('','_blank');
    if(w){
      w.document.write('<html><head><title>'+fileName+'</title></head><body style="margin:0;background:#000;display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;"><p style="color:#fff;font-size:13px;padding:12px;">長按圖片 → 儲存至相簿 或 分享</p><img src="'+dataUrl+'" style="max-width:100%;display:block;"></body></html>');
      w.document.close();
    } else { showToast('請允許彈出視窗'); }
  } else {
    const link=document.createElement('a');
    link.download=fileName;
    link.href=dataUrl;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    showToast('JPG 已下載');
  }
}

function exportPDF(){
  const printHTML=buildPrintHTML();
  const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
  if(isIOS){
    // iOS: open in new tab for share/print
    const w=window.open('','_blank');
    if(w){ w.document.write(printHTML); w.document.close();
      setTimeout(()=>w.print(),600);
    } else { showToast('請允許彈出視窗'); }
  } else {
    const iframe=document.getElementById('printFrame');
    iframe.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;border:none;display:block;z-index:9999;';
    iframe.srcdoc=printHTML;
    iframe.onload=()=>{
      setTimeout(()=>{
        iframe.contentWindow.print();
        setTimeout(()=>{ iframe.style.display='none'; },1000);
      },400);
    };
  }
}

// ══════════════════════════════════════════════
// DRAFT MANAGEMENT
// ══════════════════════════════════════════════
function openDrawer(){
  const proj = document.getElementById('f-project').value.trim() || '未命名';
  document.getElementById('draftNameInput').value = proj;
  document.getElementById('drawer').classList.add('open');
  document.getElementById('backdrop').classList.add('open');
  renderDraftList();
}
function closeDrawer(){
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('backdrop').classList.remove('open');
}
function getDrafts(){
  try{ return JSON.parse(localStorage.getItem('spacecalc_drafts')||'[]'); }
  catch{ return []; }
}
function saveDraftsLS(arr){ localStorage.setItem('spacecalc_drafts', JSON.stringify(arr)); }

function getDraftState(){
  return {
    project: document.getElementById('f-project').value,
    unit: unit,
    spaces: spaces.map(sp=>({
      id: sp.id, name: sp.name, use: sp.use, customUse: sp.customUse||'',
      L: sp.L, W: sp.W, H: sp.H, wallU: sp.wallU, lux: sp.lux,
      openings: sp.openings,
      chips: [...sp.chips],
    })),
    activeSpId: activeSpId,
    spCounter: spCounter,
  };
}

function loadDraftState(s){
  document.getElementById('f-project').value = s.project || '';
  unit = s.unit || 'cm';
  document.querySelectorAll('.unit-btn').forEach(b=>{
    b.classList.toggle('active', b.textContent.trim()===unit);
  });
  spCounter = s.spCounter || 0;
  spaces = (s.spaces||[]).map(sp=>({
    ...sp,
    chips: new Set(sp.chips||[]),
    openingCounter: sp.openings ? sp.openings.length : 0,
  }));
  activeSpId = s.activeSpId || (spaces[0]&&spaces[0].id);
  renderTabs();
  renderEditor();
  renderAll();
}

function saveDraft(){
  const name = document.getElementById('draftNameInput').value.trim();
  if(!name){ showToast('請輸入草稿名稱'); return; }
  const drafts = getDrafts();
  drafts.unshift({
    id: Date.now(),
    name,
    savedAt: new Date().toLocaleDateString('zh-TW'),
    state: getDraftState()
  });
  saveDraftsLS(drafts);
  renderDraftList();
  showToast('草稿「'+name+'」已儲存');
}

function loadDraft(id){
  const d = getDrafts().find(d=>d.id===id);
  if(!d) return;
  loadDraftState(d.state);
  closeDrawer();
  showToast('已載入「'+d.name+'」');
}

function deleteDraft(id){
  saveDraftsLS(getDrafts().filter(d=>d.id!==id));
  renderDraftList();
  showToast('已刪除');
}

function renderDraftList(){
  const drafts = getDrafts();
  const wrap = document.getElementById('draftList');
  if(!drafts.length){
    wrap.innerHTML = '<div class="drawer-empty">尚無草稿<br>填寫後點擊「儲存」</div>';
    return;
  }
  wrap.innerHTML = '';
  drafts.forEach(d=>{
    const card = document.createElement('div');
    card.className = 'draft-card';
    card.innerHTML =
      '<div class="draft-name">'+d.name+'</div>'+
      '<div class="draft-meta">'+d.savedAt+'　'+((d.state.spaces||[]).length)+' 個空間</div>'+
      '<div class="draft-acts">'+
      '<button class="d-btn d-btn-load" onclick="loadDraft('+d.id+')">載入</button>'+
      '<button class="d-btn d-btn-del" onclick="deleteDraft('+d.id+')">刪除</button>'+
      '</div>';
    wrap.appendChild(card);
  });
}

function showToast(msg){
  let t=document.getElementById('_toast');
  if(!t){t=document.createElement('div');t.id='_toast';
    t.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2b2926;color:#fff;padding:8px 18px;border-radius:20px;font-size:12px;z-index:999;transition:opacity .3s;';
    document.body.appendChild(t);}
  t.textContent=msg;t.style.opacity=1;
  clearTimeout(t._t);t._t=setTimeout(()=>t.style.opacity=0,2000);
}
</script>


<!-- DRAFT BACKDROP -->
<div class="backdrop" id="backdrop" onclick="closeDrawer()"></div>
<!-- DRAFT DRAWER -->
<div class="drawer" id="drawer">
  <div class="drawer-hd">
    <div class="drawer-title">草 稿 管 理</div>
    <button class="drawer-close" onclick="closeDrawer()">×</button>
  </div>
  <div class="drawer-save">
    <div style="font-size:11px;color:var(--ink-l);margin-bottom:7px;">儲存目前所有空間設定</div>
    <div class="d-save-row">
      <input class="d-save-input" id="draftNameInput" placeholder="草稿名稱（預帶專案名）">
      <button class="d-save-btn" onclick="saveDraft()">儲存</button>
    </div>
  </div>
  <div class="drawer-list" id="draftList"></div>
</div>
