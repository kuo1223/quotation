<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>鞋櫃容量轉換器 — 得森設計</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f3f0;--surface:#fff;--s2:#f9f8f6;--s3:#f0efe9;
  --border:#e2e0da;--border2:#d4d1c9;
  --ink:#2b2926;--ink-m:#4a4742;--ink-l:#8a8780;--ink-f:#c8c4be;
  --sage:#8a9082;--sage-lt:#eef0ea;--sage-dk:#6e7a6a;--sage-pa:#d8dcd4;
  --amber:#c8960a;--amber-lt:#fef9e7;
  --red:#c0392b;--red-lt:#fdecea;
  --green:#2e7d32;--green-lt:#f0f7f0;
  --serif:'Noto Serif TC',serif;--sans:'Noto Sans TC',sans-serif;
  --r:8px;--rl:12px;--sh:0 1px 8px rgba(0,0,0,.06);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:13px;}

/* HEADER */
header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.hd-left{display:flex;align-items:center;gap:10px;}
.hd-logo{height:32px;}
.hd-brand{font-family:var(--serif);font-size:11px;color:var(--ink-m);letter-spacing:2px;border-left:1px solid var(--border);padding-left:10px;}
.hd-title{font-family:var(--serif);font-size:14px;letter-spacing:3px;border-left:1px solid var(--border);padding-left:10px;}
.hd-right{display:flex;gap:8px;align-items:center;}
.hbtn{padding:6px 14px;border-radius:var(--r);font-size:11px;font-family:var(--sans);cursor:pointer;border:none;letter-spacing:.5px;transition:all .18s;white-space:nowrap;}
.hbtn-ghost{background:var(--s2);color:var(--ink-m);border:1px solid var(--border);}
.hbtn-ghost:hover{border-color:var(--sage);color:var(--sage-dk);}
.hbtn-primary{background:var(--sage-dk);color:#fff;}
.hbtn-primary:hover{background:#5a6a58;}
.back-btn{font-size:11px;color:var(--ink-l);text-decoration:none;padding:5px 10px;border-radius:var(--r);}
.back-btn:hover{background:var(--s3);color:var(--ink);}

/* MODE TABS */
.mode-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;display:flex;gap:0;}
.mode-tab{padding:12px 24px;font-family:var(--serif);font-size:12px;letter-spacing:2px;color:var(--ink-l);cursor:pointer;border-bottom:2px solid transparent;transition:all .18s;display:flex;align-items:center;gap:6px;}
.mode-tab:hover{color:var(--ink-m);}
.mode-tab.active{color:var(--sage-dk);border-bottom-color:var(--sage-dk);}

/* LAYOUT */
.workspace{display:grid;grid-template-columns:380px 1fr;height:calc(100vh - 100px);overflow:hidden;}
.panel-l{overflow-y:auto;padding:14px;background:var(--bg);border-right:1px solid var(--border);}
.panel-r{overflow-y:auto;padding:14px;background:var(--bg);}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);margin-bottom:10px;overflow:hidden;box-shadow:var(--sh);}
.card-hd{padding:9px 14px;background:var(--s2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px;justify-content:space-between;}
.card-title{font-family:var(--serif);font-size:11px;font-weight:400;color:var(--ink-m);letter-spacing:2px;}
.card-body{padding:12px 14px;}

/* FORM */
.field{margin-bottom:10px;}
.field:last-child{margin-bottom:0;}
.field-label{font-size:10px;color:var(--ink-l);letter-spacing:.8px;margin-bottom:3px;display:flex;justify-content:space-between;align-items:center;}
.field-row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.field-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
input[type=number],input[type=text],select{width:100%;border:1px solid var(--border2);border-radius:var(--r);padding:6px 8px;font-size:12px;font-family:var(--sans);color:var(--ink);background:var(--surface);outline:none;transition:border-color .15s;}
input:focus,select:focus{border-color:var(--sage);}

/* MEMBER CARDS */
.member-list{display:flex;flex-direction:column;gap:8px;}
.member-card{background:var(--s2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;}
.member-hd{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--s3);border-bottom:1px solid var(--border);cursor:pointer;}
.member-avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.member-name{font-size:12px;font-weight:600;color:var(--ink-m);flex:1;}
.member-tag{font-size:10px;color:var(--ink-l);}
.member-del{background:none;border:none;color:var(--ink-f);cursor:pointer;font-size:16px;padding:0 2px;}
.member-del:hover{color:var(--red);}
.member-body{padding:10px 12px;}
.member-toggle{font-size:12px;color:var(--sage-dk);cursor:pointer;margin-left:auto;}

/* SHOE TYPE ROWS */
.shoe-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
.shoe-row:last-child{margin-bottom:0;}
.shoe-icon{font-size:16px;width:24px;text-align:center;flex-shrink:0;}
.shoe-label{font-size:11px;color:var(--ink-m);flex:1;}
.shoe-spec{font-size:10px;color:var(--ink-f);}
.qty-wrap{display:flex;align-items:center;gap:4px;}
.qty-btn{width:22px;height:22px;border:1px solid var(--border2);border-radius:4px;background:var(--s2);cursor:pointer;font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;color:var(--ink-m);flex-shrink:0;}
.qty-btn:hover{background:var(--sage-lt);border-color:var(--sage);}
.qty-num{width:32px;text-align:center;font-size:12px;font-weight:600;color:var(--ink);}

/* CABINET SETTINGS */
.dim-row{display:flex;align-items:center;gap:6px;}
.dim-label{font-size:11px;color:var(--ink-l);min-width:28px;}
.dim-input{width:70px;border:1px solid var(--border2);border-radius:var(--r);padding:5px 7px;font-size:12px;text-align:center;font-family:var(--sans);color:var(--ink);background:var(--surface);outline:none;}
.dim-input:focus{border-color:var(--sage);}
.dim-unit{font-size:10px;color:var(--ink-f);}

/* TOGGLE SWITCH */
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:4px 0;}
.toggle-label{font-size:12px;color:var(--ink-m);}
.toggle{position:relative;width:36px;height:20px;flex-shrink:0;}
.toggle input{opacity:0;width:0;height:0;}
.toggle-slider{position:absolute;inset:0;background:var(--border2);border-radius:10px;cursor:pointer;transition:.3s;}
.toggle-slider:before{content:'';position:absolute;width:16px;height:16px;left:2px;bottom:2px;background:#fff;border-radius:50%;transition:.3s;}
.toggle input:checked+.toggle-slider{background:var(--sage-dk);}
.toggle input:checked+.toggle-slider:before{transform:translateX(16px);}

/* RESULTS */
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.result-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px;}
.rc{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:12px 14px;box-shadow:var(--sh);}
.rc.accent{background:var(--sage-lt);border-color:var(--sage-pa);}
.rc.amber{background:var(--amber-lt);border-color:rgba(200,150,10,.2);}
.rc.red{background:var(--red-lt);border-color:rgba(192,57,43,.2);}
.rc-label{font-size:10px;color:var(--ink-l);letter-spacing:1px;margin-bottom:4px;}
.rc-val{font-family:var(--serif);font-size:22px;color:var(--ink);}
.rc-val span{font-size:11px;color:var(--ink-l);margin-left:2px;}
.rc-sub{font-size:10px;color:var(--ink-l);margin-top:3px;line-height:1.5;}

/* LAYER TABLE */
.layer-tbl{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:10px;}
.layer-tbl th{background:var(--s2);padding:6px 8px;text-align:left;color:var(--ink-l);font-weight:400;border:1px solid var(--border);}
.layer-tbl td{padding:6px 8px;border:1px solid var(--border);color:var(--ink-m);}
.layer-tbl tr:nth-child(even) td{background:var(--s2);}
.layer-color{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:4px;}

/* CANVAS */
.canvas-wrap{background:var(--s3);border-radius:var(--rl);overflow:hidden;border:1px solid var(--border);margin-bottom:10px;}
#shoeCanvas{display:block;width:100%;height:auto;}

/* WARN / INFO BOX */
.info-box{padding:8px 12px;border-radius:var(--r);font-size:11px;line-height:1.7;margin-bottom:10px;}
.info-box.green{background:var(--green-lt);border:1px solid rgba(46,125,50,.2);color:#1b5e20;}
.info-box.amber{background:var(--amber-lt);border:1px solid rgba(200,150,10,.2);color:#7a5200;}
.info-box.red{background:var(--red-lt);border:1px solid rgba(192,57,43,.2);color:var(--red);}

/* UTILIZATION BAR */
.util-bar-wrap{height:10px;background:var(--border);border-radius:5px;overflow:hidden;margin:6px 0;}
.util-bar{height:100%;border-radius:5px;transition:width .4s,background .4s;}

/* ADD MEMBER BTN */
.add-member-btn{width:100%;padding:8px;border:1px dashed var(--border2);border-radius:var(--r);background:transparent;color:var(--ink-l);font-size:12px;font-family:var(--sans);cursor:pointer;transition:all .15s;margin-bottom:10px;}
.add-member-btn:hover{border-color:var(--sage-dk);color:var(--sage-dk);background:var(--sage-lt);}

/* TOAST */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--ink);color:#fff;padding:9px 20px;border-radius:24px;font-size:12px;opacity:0;transition:all .28s;z-index:300;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* MOBILE RWD */
@media(max-width:768px){
  header{height:auto;padding:10px 14px;flex-wrap:wrap;gap:8px;}
  .hd-left{flex-wrap:wrap;gap:6px;}
  .hd-brand{font-size:10px;letter-spacing:1px;padding-left:8px;}
  .hd-title{font-size:12px;letter-spacing:2px;padding-left:8px;}
  .hd-logo{height:28px;}
  .hd-right{width:100%;justify-content:flex-end;}
  .mode-bar{padding:0 10px;}
  .mode-tab{padding:10px 14px;font-size:11px;letter-spacing:1px;}
  .workspace{grid-template-columns:1fr !important;height:auto !important;display:flex !important;flex-direction:column;overflow:visible;}
  .panel-l{height:auto !important;overflow:visible !important;border-right:none;border-bottom:1px solid var(--border);}
  .panel-r{height:auto !important;overflow:visible !important;}
  .result-grid{grid-template-columns:1fr 1fr;}
  .result-grid-3{grid-template-columns:1fr 1fr;}
  body{overflow-y:auto !important;}
}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
</style>
</head>

  child:   {label:'兒童（7~12歲）',  icon:'🧒', shoeScale:0.7, preferred:['flat','sport','sandal','slipper']},
  teen:    {label:'青少年（13~18歲）',icon:'🧑', shoeScale:0.9, preferred:['flat','sport','heel','ankle','sandal','slipper']},
  adult:   {label:'成人（19~60歲）', icon:'👤', shoeScale:1.0, preferred:['flat','heel','sport','ankle','mid','sandal','slipper']},
  senior:  {label:'長者（60歲以上）', icon:'👴', shoeScale:1.0, preferred:['flat','sandal','slipper','sport']},
};

const MEMBER_COLORS = ['#8a9082','#9a7a6a','#6a8a9a','#8a7a9a','#7a9a8a','#9a8a6a'];

// ══════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════
let members = [];
let memberCounter = 0;
let mode = 'forward';
let expandedMember = null;

// ══════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════
document.addEventListener('DOMContentLoaded',()=>{
  addMember('爸爸','adult','male');
  addMember('媽媽','adult','female');
  calc();
});

// ══════════════════════════════════════════════
// MODE
// ══════════════════════════════════════════════
function switchMode(m){
  mode=m;
  document.getElementById('tab-forward').classList.toggle('active',m==='forward');
  document.getElementById('tab-reverse').classList.toggle('active',m==='reverse');
  document.getElementById('forwardSettings').style.display=m==='forward'?'':'none';
  document.getElementById('reverseSettings').style.display=m==='reverse'?'':'none';
  calc();
}

// ══════════════════════════════════════════════
// MEMBER MANAGEMENT
// ══════════════════════════════════════════════
function addMember(name,age,gender){
  const id=++memberCounter;
  const ageKey=age||'adult';
  const ageDef=AGE_DEFAULTS[ageKey];
  // Init shoe quantities based on age/gender defaults
  const shoes={};
  SHOE_TYPES.forEach(t=>{
    const isPref=ageDef.preferred.includes(t.id);
    let qty=0;
    if(isPref){
      if(t.id==='flat') qty=gender==='female'?5:3;
      else if(t.id==='heel') qty=gender==='female'?4:0;
      else if(t.id==='sport') qty=2;
      else if(t.id==='sandal') qty=2;
      else if(t.id==='slipper') qty=1;
      else if(t.id==='ankle') qty=gender==='female'?2:1;
      else qty=1;
    }
    // Scale for children
    qty=Math.round(qty*(ageDef.shoeScale||1));
    shoes[t.id]=qty;
  });
  members.push({id,name:name||('成員 '+id),age:ageKey,gender:gender||'other',shoes,color:MEMBER_COLORS[(id-1)%MEMBER_COLORS.length]});
  if(!name) expandedMember=id;
  renderMembers();
  calc();
}

function removeMember(id){
  members=members.filter(m=>m.id!==id);
  if(expandedMember===id) expandedMember=null;
  renderMembers();calc();
}

function toggleMember(id){
  expandedMember=expandedMember===id?null:id;
  renderMembers();
}

function renderMembers(){
  const wrap=document.getElementById('memberList');
  wrap.innerHTML='';
  members.forEach(m=>{
    const ageDef=AGE_DEFAULTS[m.age]||AGE_DEFAULTS.adult;
    const totalShoes=Object.values(m.shoes).reduce((a,b)=>a+b,0);
    const isExp=expandedMember===m.id;
    const div=document.createElement('div');
    div.className='member-card';

    let shoesHTML='';
    SHOE_TYPES.forEach(t=>{
      const qty=m.shoes[t.id]||0;
      shoesHTML+=`<div class="shoe-row">
        <span class="shoe-icon">${t.icon}</span>
        <div style="flex:1;">
          <div class="shoe-label">${t.label}</div>
          <div class="shoe-spec">${t.w}×${t.h}cm　${t.note}</div>
        </div>
        <div class="qty-wrap">
          <div class="qty-btn" onclick="adjShoe(${m.id},'${t.id}',-1)">−</div>
          <div class="qty-num" id="sq-${m.id}-${t.id}">${qty}</div>
          <div class="qty-btn" onclick="adjShoe(${m.id},'${t.id}',1)">＋</div>
        </div>
      </div>`;
    });

    div.innerHTML=`
      <div class="member-hd" onclick="toggleMember(${m.id})">
        <div class="member-avatar" style="background:${m.color}20;border:1px solid ${m.color}40;">
          ${ageDef.icon}
        </div>
        <div>
          <div class="member-name" id="mn-${m.id}">${m.name}</div>
          <div class="member-tag">${ageDef.label}　共 ${totalShoes} 雙</div>
        </div>
        <div style="display:flex;align-items:center;gap:6px;margin-left:auto;">
          <span style="font-size:18px;color:var(--ink-l);">${isExp?'▲':'▼'}</span>
          <button class="member-del" onclick="event.stopPropagation();removeMember(${m.id})">×</button>
        </div>
      </div>
      ${isExp?`<div class="member-body">
        <div class="field-row2" style="margin-bottom:10px;">
          <div class="field">
            <div class="field-label">姓名</div>
            <input type="text" value="${m.name}" 
            oninput="members.find(x=>x.id==${m.id}).name=this.value;
              document.getElementById('mn-'+${m.id}) && (document.getElementById('mn-'+${m.id}).textContent=this.value||('成員 '+${m.id}));
              calc();"
            onblur="renderTabs();">
          </div>

        </div>
        <div class="field" style="margin-bottom:10px;">
          <div class="field-label">年齡層</div>
          <select onchange="members.find(x=>x.id==${m.id}).age=this.value;renderMembers();calc();">
            ${Object.entries(AGE_DEFAULTS).map(([k,v])=>`<option value="${k}" ${m.age===k?'selected':''}>${v.label}</option>`).join('')}
          </select>
        </div>
        <div style="font-size:10px;color:var(--ink-l);letter-spacing:1px;margin-bottom:8px;">各類型鞋子數量</div>
        ${shoesHTML}
      </div>`:''}
    `;
    wrap.appendChild(div);
  });
}

function adjShoe(memberId,shoeId,delta){
  const m=members.find(x=>x.id===memberId);
  if(!m) return;
  m.shoes[shoeId]=Math.max(0,(m.shoes[shoeId]||0)+delta);
  const el=document.getElementById('sq-'+memberId+'-'+shoeId);
  if(el) el.textContent=m.shoes[shoeId];
  renderMembers();calc();
}

// ══════════════════════════════════════════════
// CALCULATION CORE
// ══════════════════════════════════════════════
function getPlacementFactor(placement){
  if(placement==='diagonal') return 0.80;
  if(placement==='front-back') return 1.30;
  return 1.0;
}

// Aggregate all shoes across members
function aggregateShoes(){
  const total={};
  SHOE_TYPES.forEach(t=>{ total[t.id]=0; });
  members.forEach(m=>{
    SHOE_TYPES.forEach(t=>{
      total[t.id]+=(m.shoes[t.id]||0);
    });
  });
  return total;
}

// Group shoes into layer zones by height
function getZones(totalShoes, reserve, placement){
  const factor=getPlacementFactor(placement);
  const zones=[
    {label:'拖鞋 / 涼鞋',      height:12, ids:['sandal','slipper'], color:'#c8e6c9'},
    {label:'平底鞋 / 休閒鞋',  height:17, ids:['flat','safety'],    color:'#bbdefb'},
    {label:'運動鞋',            height:17, ids:['sport'],            color:'#e1bee7'},
    {label:'高跟鞋',            height:22, ids:['heel'],             color:'#fce4ec'},
    {label:'短靴（踝靴）',      height:27, ids:['ankle'],            color:'#fff9c4'},
    {label:'中筒靴',            height:37, ids:['mid'],              color:'#ffe0b2'},
    {label:'長靴 / 雨靴',      height:52, ids:['long','rain'],      color:'#b2dfdb'},
  ];
  const result=[];
  zones.forEach(z=>{
    let count=0;
    z.ids.forEach(id=>{ count+=totalShoes[id]||0; });
    if(count===0) return;
    const countWithReserve=Math.ceil(count*(1+reserve));
    result.push({...z, count, countWithReserve, factor});
  });
  return result;
}

function calc(){
  if(members.length===0){
    document.getElementById('resultPanel').innerHTML=
      '<div style="text-align:center;padding:40px;color:var(--ink-f);font-size:12px;">新增家族成員並輸入鞋子數量後顯示結果</div>';
    return;
  }
  if(mode==='forward') calcForward();
  else calcReverse();
}

// ══════════════════════════════════════════════
// FORWARD MODE
// ══════════════════════════════════════════════
function calcForward(){
  const reserve=parseFloat(document.getElementById('f-reserve').value)||0;
  const placement=document.getElementById('f-placement').value;
  const depth=parseFloat(document.getElementById('f-depth').value)||35;
  const board=parseFloat(document.getElementById('f-board').value)||1.8;
  const doorW=parseFloat(document.getElementById('f-door-w').value)||0;
  const hasBench=document.getElementById('f-bench').checked;
  const benchH=hasBench?45:0;
  const factor=getPlacementFactor(placement);

  const total=aggregateShoes();
  const totalPairs=Object.values(total).reduce((a,b)=>a+b,0);
  const totalWithReserve=Math.ceil(totalPairs*(1+reserve));
  const zones=getZones(total,reserve,placement);

  // For each zone, calc how many pairs per row (width-based)
  // We need to find the minimum width that fits all zones
  // Strategy: assume standard shoe width with factor adjustment
  // Each zone layer holds: floor(cabinetW / (shoeW / factor))
  // We need to find W such that sum of layers * layerHeight <= totalH

  // First calculate total height needed for a given width
  // Then suggest width and number of doors
  let suggestedW=0;
  let layerData=[];
  let totalH=benchH+(board*2); // top+bottom board

  zones.forEach(z=>{
    // representative shoe width for this zone
    const repType=SHOE_TYPES.find(t=>z.ids.includes(t.id));
    const shoeW=repType?repType.w:25;
    const effectiveShoeW=Math.round(shoeW/factor);
    // For a 90cm cabinet: pairs per layer
    const tempW=90;
    const pairsPerLayer=Math.floor(tempW/effectiveShoeW);
    const layers=Math.ceil(z.countWithReserve/Math.max(1,pairsPerLayer));
    layerData.push({...z,shoeW,effectiveShoeW,pairsPerLayer,layers,tempW});
    totalH+=layers*(z.height+board);
  });

  // Find optimal width: try widths from 60 to 300cm
  // Taiwan industry standard: max single cabinet 120cm, total 90~150cm
  // Try widths in practical range: 60~150cm (single cabinet)
  // If 150cm still not enough height, suggest 2 cabinets
  let bestW=0, bestLayers=[], needTwoCabinets=false;
  for(let w=60;w<=150;w+=5){
    let h=benchH+(board*2);
    const ld=zones.map(z=>{
      const repType=SHOE_TYPES.find(t=>z.ids.includes(t.id));
      const shoeW=repType?repType.w:25;
      const effectiveShoeW=Math.max(10,Math.round(shoeW/factor));
      const pairsPerLayer=Math.max(1,Math.floor(w/effectiveShoeW));
      const layers=Math.ceil(z.countWithReserve/pairsPerLayer);
      h+=layers*(z.height+board);
      return {...z,shoeW,effectiveShoeW,pairsPerLayer,layers,w};
    });
    if(h<=240&&!bestW){bestW=w;bestLayers=ld;}
  }
  if(!bestW){
    // Even 150cm not enough - suggest 2 cabinets at 90cm each (total 180cm)
    bestW=90; needTwoCabinets=true;
  }

  // Recalc with bestW
  let finalH=benchH+(board*2);
  const finalLayers=zones.map(z=>{
    const repType=SHOE_TYPES.find(t=>z.ids.includes(t.id));
    const shoeW=repType?repType.w:25;
    const effectiveShoeW=Math.max(10,Math.round(shoeW/factor));
    const pairsPerLayer=Math.max(1,Math.floor(bestW/effectiveShoeW));
    const layers=Math.ceil(z.countWithReserve/pairsPerLayer);
    finalH+=layers*(z.height+board);
    return {...z,shoeW,effectiveShoeW,pairsPerLayer,layers};
  });
  finalH=Math.round(finalH);

  const doors=doorW>0?Math.ceil(bestW/doorW):1;
  const totalCapacity=finalLayers.reduce((s,l)=>s+l.pairsPerLayer*l.layers,0);

  renderForwardResults({bestW,finalH,finalLayers,totalPairs,totalWithReserve,
    reserve,doors,doorW,hasBench,benchH,board,depth,totalCapacity,placement,needTwoCabinets});
}

// ══════════════════════════════════════════════
// REVERSE MODE
// ══════════════════════════════════════════════
function calcReverse(){
  const W=parseFloat(document.getElementById('r-width').value)||120;
  const H=parseFloat(document.getElementById('r-height').value)||200;
  const depth=parseFloat(document.getElementById('r-depth').value)||35;
  const board=parseFloat(document.getElementById('r-board').value)||1.8;
  const hasBench=document.getElementById('r-bench').checked;
  const placement=document.getElementById('r-placement').value;
  const factor=getPlacementFactor(placement);
  const benchH=hasBench?45:0;
  const usableH=H-benchH-(board*2);
  const placementLabel={'normal':'正放','diagonal':'斜放','front-back':'前後錯位'}[placement]||'正放';

  // For each zone, calc how many layers fit and pairs per layer
  const zones=[
    {label:'拖鞋 / 涼鞋',     height:12,ids:['sandal','slipper'],color:'#c8e6c9',shoeW:25},
    {label:'平底鞋 / 休閒鞋', height:17,ids:['flat','safety'],   color:'#bbdefb',shoeW:25},
    {label:'運動鞋',           height:17,ids:['sport'],           color:'#e1bee7',shoeW:30},
    {label:'高跟鞋',           height:22,ids:['heel'],            color:'#fce4ec',shoeW:25},
    {label:'短靴（踝靴）',     height:27,ids:['ankle'],           color:'#fff9c4',shoeW:25},
    {label:'中筒靴',           height:37,ids:['mid'],             color:'#ffe0b2',shoeW:25},
    {label:'長靴 / 雨靴',     height:52,ids:['long','rain'],     color:'#b2dfdb',shoeW:25},
  ];

  // Try to fit as many zone types as possible within usableH
  // Priority: fit the most common types first
  const priority=['slipper','sandal','flat','sport','heel','ankle','mid','long'];
  let remainH=usableH;
  const fittedZones=[];
  let totalCapacity=0;

  zones.forEach(z=>{
    const layerH=z.height+board;
    if(remainH<layerH) return;
    const effectiveShoeW=Math.max(10,Math.round(z.shoeW/factor));
    const pairsPerLayer=Math.max(1,Math.floor(W/effectiveShoeW));
    const maxLayers=Math.floor(remainH/layerH);
    const layers=Math.min(maxLayers,3); // max 3 layers per type for balance
    remainH-=layers*layerH;
    const capacity=pairsPerLayer*layers;
    totalCapacity+=capacity;
    fittedZones.push({...z,pairsPerLayer,layers,capacity,effectiveShoeW});
  });

  const usedH=usableH-remainH;
  const utilization=Math.round(usedH/usableH*100);
  const utilClass=utilization>90?'green':utilization>60?'amber':'red';

  // Compare with member needs
  const total=aggregateShoes();
  const totalPairs=Object.values(total).reduce((a,b)=>a+b,0);
  const canFit=totalCapacity>=totalPairs;

  let html=`
  <div class="result-grid">
    <div class="rc accent">
      <div class="rc-label">總可容納雙數</div>
      <div class="rc-val">${totalCapacity}<span>雙</span></div>
      <div class="rc-sub">${placementLabel}　${fittedZones.length} 種鞋型</div>
    </div>
    <div class="rc ${canFit?'accent':'red'}">
      <div class="rc-label">家族鞋子需求</div>
      <div class="rc-val">${totalPairs}<span>雙</span></div>
      <div class="rc-sub">${canFit?'✅ 空間足夠':'⚠ 空間不足 '+(totalPairs-totalCapacity)+' 雙'}</div>
    </div>
    <div class="rc">
      <div class="rc-label">空間利用率</div>
      <div class="rc-val">${utilization}<span>%</span></div>
      <div class="rc-sub">已用 ${Math.round(usedH)}cm / 可用 ${Math.round(usableH)}cm</div>
    </div>
    <div class="rc">
      <div class="rc-label">剩餘空間</div>
      <div class="rc-val">${Math.round(remainH)}<span>cm</span></div>
      <div class="rc-sub">${remainH>20?'可加入抽屜或儲物格':'空間緊湊'}</div>
    </div>
  </div>

  <div class="info-box ${canFit?'green':'red'}">
    ${canFit
      ?`✅ 此鞋櫃（${W}×${H}cm）可容納 ${totalCapacity} 雙鞋，比家族需求（${totalPairs} 雙）多出 ${totalCapacity-totalPairs} 雙空間。`
      :`⚠ 此鞋櫃（${W}×${H}cm）僅能容納 ${totalCapacity} 雙，家族共需 ${totalPairs} 雙，不足 ${totalPairs-totalCapacity} 雙。建議加寬至 ${Math.ceil(W*(totalPairs/totalCapacity))} cm 或增加一組鞋櫃。`
    }
  </div>

  <div style="margin-bottom:10px;">
    <div style="font-size:11px;color:var(--ink-l);margin-bottom:4px;">空間利用率</div>
    <div class="util-bar-wrap">
      <div class="util-bar" style="width:${utilization}%;background:${utilization>80?'var(--sage-dk)':utilization>50?'var(--amber)':'var(--red)'};"></div>
    </div>
  </div>

  <div class="card" style="margin-bottom:10px;">
    <div class="card-hd"><span class="card-title">各 鞋 型 可 容 納 數 量</span></div>
    <div class="card-body">
      <table class="layer-tbl">
        <thead><tr><th>鞋型</th><th>層板間距</th><th>每層容量</th><th>層數</th><th>可放雙數</th><th>家族需求</th><th>狀態</th></tr></thead>
        <tbody>
          ${hasBench?`<tr><td>穿鞋椅區</td><td>45 cm</td><td>—</td><td>—</td><td>—</td><td>—</td><td>—</td></tr>`:''}
          ${fittedZones.map(z=>{
            const need=z.ids.reduce((s,id)=>s+(total[id]||0),0);
            const ok=z.capacity>=need;
            return `<tr>
              <td><span class="layer-color" style="background:${z.color};"></span>${z.label}</td>
              <td>${z.height} cm</td>
              <td>${z.pairsPerLayer} 雙</td>
              <td>${z.layers} 層</td>
              <td><strong>${z.capacity}</strong> 雙</td>
              <td>${need} 雙</td>
              <td>${need===0?'—':ok?'✅':'⚠'}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <div class="card-hd"><span class="card-title">鞋 櫃 立 面 示 意 圖</span></div>
    <div class="card-body">
      <div class="canvas-wrap"><canvas id="shoeCanvas" width="680" height="500"></canvas></div>
    </div>
  </div>`;

  document.getElementById('resultPanel').innerHTML=html;
  drawCanvas(W,H,fittedZones,hasBench,benchH,board,'reverse');
}

// ══════════════════════════════════════════════
// CANVAS DRAWING
// ══════════════════════════════════════════════
function drawCanvas(cabinetW,cabinetH,layers,hasBench,benchH,board,mode2){
  const canvas=document.getElementById('shoeCanvas');
  if(!canvas) return;
  const ctx=canvas.getContext('2d');
  const CW=canvas.width, CH=canvas.height;
  ctx.clearRect(0,0,CW,CH);

  const PAD={t:30,b:40,l:60,r:30};
  const dw=CW-PAD.l-PAD.r;
  const dh=CH-PAD.t-PAD.b;
  const scaleY=dh/cabinetH;
  const ox=PAD.l, oy=PAD.t;

  // Cabinet background
  ctx.fillStyle='#f9f8f6';
  ctx.fillRect(ox,oy,dw,dh);
  ctx.strokeStyle='#c8c0b0';
  ctx.lineWidth=2;
  ctx.strokeRect(ox,oy,dw,dh);

  // Draw layers from bottom up
  let y=oy+dh; // start from bottom

  // Bottom board
  ctx.fillStyle='#d4cfc8';
  ctx.fillRect(ox,y-board*scaleY,dw,board*scaleY);
  y-=board*scaleY;

  // Bench area
  if(hasBench&&benchH>0){
    const bH=benchH*scaleY;
    ctx.fillStyle='#ede8e0';
    ctx.fillRect(ox,y-bH,dw,bH);
    ctx.strokeStyle='rgba(0,0,0,.1)';
    ctx.lineWidth=1;
    ctx.strokeRect(ox,y-bH,dw,bH);
    // Label
    ctx.fillStyle='#8a8780';
    ctx.font='11px Noto Sans TC,sans-serif';
    ctx.textAlign='center';
    ctx.fillText('穿鞋椅　'+benchH+' cm',ox+dw/2,y-bH/2+4);
    y-=bH;
    // Board above bench
    ctx.fillStyle='#d4cfc8';
    ctx.fillRect(ox,y-board*scaleY,dw,board*scaleY);
    y-=board*scaleY;
  }

  // Shoe zones
  [...layers].reverse().forEach(z=>{
    for(let l=0;l<z.layers;l++){
      const zH=z.height*scaleY;
      // Zone fill
      ctx.fillStyle=z.color+'99';
      ctx.fillRect(ox+1,y-zH,dw-2,zH);
      // Shoe icons (simplified rectangles)
      const shoeW_px=Math.max(4,dw/z.pairsPerLayer-2);
      const shoeH_px=Math.max(4,zH-4);
      for(let s=0;s<z.pairsPerLayer;s++){
        const sx=ox+2+s*(dw/z.pairsPerLayer);
        ctx.fillStyle=z.color;
        ctx.strokeStyle='rgba(0,0,0,.12)';
        ctx.lineWidth=0.5;
        ctx.beginPath();
        ctx.roundRect(sx+1,y-zH+2,shoeW_px,shoeH_px,2);
        ctx.fill();ctx.stroke();
      }
      // Dimension label
      ctx.fillStyle='#4a4742';
      ctx.font='10px Noto Sans TC,sans-serif';
      ctx.textAlign='left';
      if(l===0) ctx.fillText(z.label,ox+4,y-zH/2+3);
      y-=zH;
      // Layer board
      ctx.fillStyle='#d4cfc8';
      ctx.fillRect(ox,y-board*scaleY,dw,board*scaleY);
      y-=board*scaleY;
    }
  });

  // Dimension annotations
  ctx.fillStyle='#8a8780';
  ctx.font='11px Noto Sans TC,sans-serif';
  ctx.textAlign='center';
  ctx.fillText(cabinetW+' cm',ox+dw/2,oy-8);
  ctx.save();
  ctx.translate(ox-14,(oy+oy+dh)/2);
  ctx.rotate(-Math.PI/2);
  ctx.fillText(cabinetH+' cm',0,0);
  ctx.restore();

  // Height tick marks
  ctx.strokeStyle='rgba(138,135,128,.3)';
  ctx.lineWidth=1;
  ctx.setLineDash([2,4]);
  ctx.beginPath();ctx.moveTo(ox+dw,oy);ctx.lineTo(ox+dw+8,oy);ctx.stroke();
  ctx.beginPath();ctx.moveTo(ox+dw,oy+dh);ctx.lineTo(ox+dw+8,oy+dh);ctx.stroke();
  ctx.setLineDash([]);
}

// ══════════════════════════════════════════════
// EXPORT
// ══════════════════════════════════════════════
async function exportJPG(){
  showToast('圖片產生中，請稍候…');
  if(typeof html2canvas==='undefined'){
    await new Promise((res,rej)=>{
      const s=document.createElement('script');
      s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
      s.onload=res;s.onerror=rej;document.head.appendChild(s);
    });
  }
  const target=document.getElementById('resultPanel');
  // 暫時展開完整高度讓 html2canvas 截到全部內容
  const origOverflow = target.style.overflow;
  const origHeight = target.style.height;
  const origMaxHeight = target.style.maxHeight;
  target.style.overflow = 'visible';
  target.style.height = 'auto';
  target.style.maxHeight = 'none';
  await new Promise(r=>setTimeout(r,100));
  const fullH = target.scrollHeight;
  const canvas=await html2canvas(target,{
    scale:2,useCORS:true,backgroundColor:'#f4f3f0',
    width:target.offsetWidth,
    height:fullH,
    windowWidth:target.offsetWidth,
    scrollX:0,scrollY:0
  });
  // 還原
  target.style.overflow = origOverflow;
  target.style.height = origHeight;
  target.style.maxHeight = origMaxHeight;
  const dataUrl=canvas.toDataURL('image/jpeg',0.92);
  const fileName='鞋櫃容量_'+new Date().toLocaleDateString('zh-TW').replace(/\//g,'-')+'.jpg';
  const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
  if(isIOS){
    const w=window.open('','_blank');
    if(w){
      w.document.write('<html><head><title>'+fileName+'</title></head><body style="margin:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;"><p style="color:#fff;font-size:13px;padding:12px;">長按圖片 → 儲存至相簿 或 分享</p><img src="'+dataUrl+'" style="max-width:100%;display:block;"></body></html>');
      w.document.close();
    } else showToast('請允許彈出視窗');
  } else {
    const link=document.createElement('a');
    link.download=fileName;link.href=dataUrl;
    document.body.appendChild(link);link.click();document.body.removeChild(link);
    showToast('JPG 已下載');
  }
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2500);
}
</script>
